<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Kvisa Dispatch</title>
<link rel="icon" type="image/png" href="icon-192-v2.png">
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon-v2.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kvisa">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#F5F7F3; --surface:#FFFFFF; --surface-2:#EEF2EA; --line:#DEE5DA;
  --ink:#17251E; --ink-soft:#57685D; --ink-faint:#8C978C;
  --primary:#1F5C50; --primary-dark:#123B33; --primary-light:#DCEEE7;
  --accent:#CE7F2E; --accent-light:#F8E3C6; --accent-ink:#8A5A16;
  --danger:#B8433A; --danger-light:#F8DEDA;
  --green:#2E9E5B; --amber:#CE7F2E; --gray:#8C978C;
  --st-open:#B8752A; --st-open-bg:#F7E9D4;
  --st-assigned:#5C5FA0; --st-assigned-bg:#E7E7F3;
  --st-posted:#2D7FA0; --st-posted-bg:#DCECF2;
  --st-delivered:#2F8C6C; --st-delivered-bg:#DDF0E6;
  --st-finished:#8757B0; --st-finished-bg:#EBE1F5;
  --st-completed:#227A50; --st-completed-bg:#D9F0E2;
  --st-not_covered:#B8433A; --st-not_covered-bg:#F8DEDA;
  --st-cancelled:#8C978C; --st-cancelled-bg:#ECEFE9;
  --radius-s:8px; --radius-m:14px; --radius-l:22px;
  --shadow:0 1px 2px rgba(15,35,29,.05), 0 10px 24px -14px rgba(15,35,29,.25);
  --font-display:'Space Grotesk', system-ui, sans-serif;
  --font-body:'Inter', system-ui, -apple-system, sans-serif;
}
:root{color-scheme:light;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;color:var(--ink);font-weight:600;}
a{color:var(--primary);}
button,input,select,textarea{font-family:var(--font-body);}
#app{min-height:100vh;display:flex;flex-direction:column;}

/* top bar + drawer */
.header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;background:var(--surface);color:var(--ink);padding:12px 14px;border-bottom:1px solid var(--line);}
.header .title{font-family:var(--font-display);font-size:19px;font-weight:600;flex:1;letter-spacing:.2px;color:var(--primary-dark);}
.icon-btn{background:none;border:none;color:var(--ink);padding:6px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.icon-btn:hover{background:var(--surface-2);}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--primary-light);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--primary-dark);flex-shrink:0;border:none;cursor:pointer;}
.hamburger-menu{position:fixed;inset:0;background:rgba(15,25,20,.4);z-index:30;}
.hamburger-panel{position:fixed;top:0;left:0;bottom:0;width:78%;max-width:300px;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;animation:slideIn .18s ease;}
@keyframes slideIn{from{transform:translateX(-100%);}to{transform:none;}}
.drawer-head{padding:20px 18px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;}
.drawer-head .brand-logo{height:34px;width:auto;}
.drawer-head .brand-name{font-family:var(--font-display);font-size:16px;font-weight:600;color:var(--ink-soft);}
.drawer-nav{padding:8px;flex:1;overflow-y:auto;}
.nav-item{display:flex;align-items:center;gap:14px;padding:12px;border-radius:10px;cursor:pointer;color:var(--ink-soft);font-weight:500;}
.nav-item svg{flex-shrink:0;opacity:.85;}
.nav-item:hover{background:var(--surface-2);}
.nav-item.active{background:var(--primary-light);color:var(--primary-dark);}
hr.sep{border:none;height:1px;background:var(--line);margin:8px 6px;}

.main{flex:1;padding:16px;padding-bottom:100px;max-width:900px;width:100%;margin:0 auto;}
.footer{text-align:center;padding:20px 16px 28px;color:var(--ink-faint);font-size:12px;}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--radius-m);border:1.5px solid transparent;cursor:pointer;font-weight:600;font-size:14px;padding:11px 16px;width:100%;transition:transform .1s ease, background .15s ease;}
.btn:active{transform:scale(.98);}
.btn svg{width:16px;height:16px;flex-shrink:0;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-dark);}
.btn-outline{background:transparent;border-color:var(--line);color:var(--ink);}
.btn-outline:hover{background:var(--surface-2);}
.btn-danger{background:transparent;border-color:var(--danger-light);color:var(--danger);}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:10px;width:auto;}
.btn-row{display:flex;gap:10px;}
.btn-row .btn{flex:1;}
.fab{position:fixed;right:18px;bottom:24px;width:56px;height:56px;border-radius:50%;background:var(--primary);color:#fff;border:none;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px -6px rgba(18,59,51,.5);cursor:pointer;z-index:15;}
.fab svg{width:24px;height:24px;}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);padding:16px;margin-bottom:12px;}
.page-head{margin-bottom:12px;}
.page-head h2{font-size:22px;}
.page-head .sub{color:var(--ink-soft);font-size:13.5px;margin-top:2px;}
.section-title{font-family:var(--font-display);font-size:22px;font-weight:600;margin:4px 0 14px;}
.hero-card{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius-l);padding:20px;}
.hero-card h2{color:var(--ink);font-size:24px;display:flex;align-items:center;gap:10px;}
.hero-card .back-btn{width:38px;height:38px;border-radius:50%;background:var(--surface-2);border:none;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;margin-bottom:14px;}
.hero-card .badges{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.badge-white{background:var(--primary-light)!important;color:var(--primary-dark)!important;}
.section-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);padding:16px;margin-top:14px;}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
.section-name{display:flex;align-items:center;gap:10px;}
.section-name .icn{width:34px;height:34px;border-radius:9px;background:var(--primary-light);color:var(--primary-dark);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.section-name h3{font-size:16px;}
.field-row{display:flex;align-items:flex-start;gap:12px;padding:9px 0;}
.field-row + .field-row{border-top:1px solid var(--line);}
.field-row .ficn{width:30px;height:30px;border-radius:8px;background:var(--surface-2);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.field-row .flabel{font-size:11.5px;letter-spacing:.02em;color:var(--ink-faint);font-weight:600;text-transform:uppercase;}
.field-row .fval{font-size:15px;color:var(--ink);margin-top:2px;word-break:break-word;}
.field-row .fval a{font-weight:600;text-decoration:none;}
.field-row .fval.none{color:var(--ink-faint);}

/* status */
.card.req-card{border-left:4px solid var(--st-open);padding:14px;}
.card.status-open{border-left-color:var(--st-open);} .card.status-assigned{border-left-color:var(--st-assigned);}
.card.status-posted_pickup,.card.status-posted_return{border-left-color:var(--st-posted);}
.card.status-delivered{border-left-color:var(--st-delivered);} .card.status-finished{border-left-color:var(--st-finished);}
.card.status-completed{border-left-color:var(--st-completed);} .card.status-not_covered{border-left-color:var(--st-not_covered);}
.card.status-cancelled{border-left-color:var(--st-cancelled);}
.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;}
.badge.status-open{background:var(--st-open-bg);color:var(--st-open);}
.badge.status-assigned{background:var(--st-assigned-bg);color:var(--st-assigned);}
.badge.status-posted_pickup,.badge.status-posted_return{background:var(--st-posted-bg);color:var(--st-posted);}
.badge.status-delivered{background:var(--st-delivered-bg);color:var(--st-delivered);}
.badge.status-finished{background:var(--st-finished-bg);color:var(--st-finished);}
.badge.status-completed{background:var(--st-completed-bg);color:var(--st-completed);}
.badge.status-not_covered{background:var(--st-not_covered-bg);color:var(--st-not_covered);}
.badge.status-cancelled{background:var(--st-cancelled-bg);color:var(--st-cancelled);}
.badge.plain{cursor:default;}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0;}
.dot.green{background:var(--green);box-shadow:0 0 0 3px rgba(46,158,91,.18);}
.dot.amber{background:var(--amber);box-shadow:0 0 0 3px rgba(206,127,46,.18);}
.dot.gray{background:var(--gray);box-shadow:0 0 0 3px rgba(140,151,140,.14);}
.status-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.status-dot.status-completed{background:var(--st-completed);} .status-dot.status-not_covered{background:var(--st-not_covered);} .status-dot.status-cancelled{background:var(--st-cancelled);}

/* forms */
input,select,textarea{width:100%;padding:11px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:15px;}
input:focus,select:focus,textarea:focus{outline:2px solid var(--primary);outline-offset:1px;border-color:var(--primary);}
textarea{resize:vertical;min-height:64px;}
label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin:12px 0 6px;}
.field{margin-bottom:4px;}
.hint{font-size:11.5px;color:var(--ink-faint);font-weight:500;}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;}
.chip{padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink-soft);font-size:13.5px;font-weight:600;cursor:pointer;user-select:none;}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff;}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;}
.switch{position:relative;width:44px;height:26px;border-radius:999px;background:var(--line);cursor:pointer;flex-shrink:0;}
.switch.on{background:var(--primary);}
.switch .knob{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s ease;}
.switch.on .knob{left:21px;}
.search-box{position:relative;}
.search-box svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-faint);pointer-events:none;}
.search-box input{padding-left:38px;}
.error-text{color:var(--danger);font-size:13px;margin-top:6px;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:8px;}

/* tabs */
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:12px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{display:flex;align-items:center;gap:6px;padding:9px 12px;white-space:nowrap;color:var(--ink-faint);font-weight:600;font-size:13.5px;cursor:pointer;border-bottom:2.5px solid transparent;flex-shrink:0;}
.tab.active{color:var(--primary);border-bottom-color:var(--primary);}
.tab .count{background:var(--surface-2);color:var(--ink-soft);border-radius:999px;padding:1px 7px;font-size:11.5px;}
.tab.active .count{background:var(--primary);color:#fff;}
.tab.tab-icon{padding:9px 8px;opacity:.6;}
.tab.tab-icon svg{width:15px;height:15px;}
.date-group-label{font-family:var(--font-display);font-weight:700;font-size:15px;margin:18px 0 10px;color:var(--ink-soft);}
.date-group-label:first-child{margin-top:4px;}

/* request card */
.req-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;}
.req-id{font-family:var(--font-display);font-weight:700;font-size:15px;}
.req-head .by{font-size:12px;color:var(--ink-faint);margin-left:6px;font-weight:500;}
.req-tools{display:flex;align-items:center;gap:2px;}
.icon-only{background:none;border:none;cursor:pointer;padding:6px;border-radius:8px;color:var(--ink-faint);display:inline-flex;}
.icon-only:hover{background:var(--surface-2);color:var(--ink);}
.icon-only.danger:hover{color:var(--danger);}
.icon-only svg{width:17px;height:17px;}
.req-line{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ink-soft);margin-bottom:5px;flex-wrap:wrap;}
.req-line svg{width:15px;height:15px;flex-shrink:0;}
.name-link{color:var(--primary);font-weight:700;cursor:pointer;}
.name-link:hover{text-decoration:underline;}
.person-box{padding:9px 11px;border:1px solid var(--line);border-radius:10px;margin-top:8px;background:var(--surface-2);font-size:13.5px;}
.person-box .role{font-size:11px;color:var(--ink-faint);display:block;font-weight:600;text-transform:uppercase;letter-spacing:.02em;}
.person-box a{color:var(--ink-soft);text-decoration:none;}
.person-box{position:relative;}
.person-box .addr{font-size:12.5px;color:var(--ink-soft);margin-top:1px;}
.box-x{position:absolute;top:6px;right:6px;background:none;border:none;color:var(--ink-faint);cursor:pointer;padding:4px;border-radius:6px;display:flex;}
.box-x:hover{background:var(--danger-light);color:var(--danger);}
.box-x svg{width:13px;height:13px;}
.req-line a,.lc-sub a{color:var(--ink-soft);text-decoration:none;}
.req-line a:hover,.lc-sub a:hover{color:var(--primary);text-decoration:underline;}
.msg-preview{white-space:pre-wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13.5px;color:var(--ink-soft);}
.send-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;}
.send-grid .btn{text-decoration:none;}
.add-link{display:inline-block;margin:6px 0 2px;font-size:13px;font-weight:600;color:var(--primary);cursor:pointer;}
.added-on{font-size:11px;color:var(--ink-faint);font-weight:600;margin:10px 0 -4px 2px;}
/* ---------- layout helpers (one column on phones) ---------- */
.side-nav{display:none;}
.card-grid,.list-grid,.profile-grid,.row-list{display:block;}
/* ---------- computers and big screens ---------- */
@media (min-width: 1024px){
  .shell{display:flex;min-height:100vh;}
  .side-nav{display:flex;flex-direction:column;width:250px;flex-shrink:0;position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);}
  .shell-main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .menu-btn{display:none!important;}
  .header{padding:14px 32px;}
  .main{max-width:1320px;padding:24px 32px 100px;}
  .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:14px;align-items:start;}
  .card-grid > .card{margin-bottom:0;}
  .list-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;align-items:start;}
  .list-grid > .list-card{margin-bottom:0;}
  .profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px;align-items:start;}
  .profile-grid > .section-card{margin-top:0;}
  .stat-grid{grid-template-columns:repeat(3,1fr);}
  .top-grid{grid-template-columns:1fr 1fr;}
  .toolbar .search-box{max-width:520px;}
  .main > .btn-primary:first-child, .page-head + .btn-primary{max-width:320px;}
  .fab{right:32px;bottom:32px;}
  .list-card:hover,.req-row:hover{border-color:var(--primary);box-shadow:var(--shadow);}
}
@media (min-width: 1500px){ .card-grid{grid-template-columns:repeat(auto-fill,minmax(400px,1fr));} }
.day-block{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px;}
.day-name{font-family:var(--font-display);font-weight:700;font-size:14px;color:var(--primary-dark);}
.day-block .req-actions .btn{flex:1 1 130px;}
.meta{font-size:11.5px;color:var(--ink-faint);text-align:center;margin:18px 0 4px;line-height:1.7;}
.person-box.faded{padding:5px 11px;font-size:12px;opacity:.75;}
.person-box.faded .role{font-size:10px;}
.person-box.empty{border-style:dashed;background:transparent;color:var(--ink-faint);}
.private{background:var(--accent-light);color:var(--accent-ink);border-radius:10px;padding:8px 11px;font-size:13px;margin-top:8px;}
.req-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
.req-actions .btn{width:auto;flex:1 1 150px;padding:9px 12px;font-size:13px;border-radius:10px;}
.req-row{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px;cursor:pointer;font-size:13px;}
.req-row .row-text{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-soft);}
.req-row b{font-family:var(--font-display);}
.req-row .sub{white-space:nowrap;font-size:12px;color:var(--ink-faint);}

/* lists */
.list-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);padding:13px 16px;margin-bottom:10px;cursor:pointer;}
.list-card:hover{border-color:var(--primary);}
.lc-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.lc-name{font-weight:700;font-size:15.5px;display:flex;align-items:center;gap:8px;min-width:0;}
.lc-sub{font-size:13px;color:var(--ink-soft);margin-top:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.lc-sub svg{width:14px;height:14px;flex-shrink:0;color:var(--ink-faint);}
.count-pill{display:inline-flex;align-items:center;gap:4px;min-width:30px;justify-content:center;padding:3px 10px;border-radius:999px;background:var(--primary-light);color:var(--primary-dark);font-weight:700;font-size:13px;flex-shrink:0;}
.count-pill svg{width:13px;height:13px;}
.count-pill.zero{background:var(--surface-2);color:var(--ink-faint);}
.tag{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--st-completed-bg);color:var(--st-completed);}
.tag.gray{background:var(--surface-2);color:var(--ink-soft);}
.tag svg{width:11px;height:11px;vertical-align:-1px;}
.tag.suspended{background:var(--danger-light);color:var(--danger);}
.badge-suspended{background:var(--danger)!important;color:#fff!important;}
.chip.chip-suspended{color:var(--danger);border-color:var(--danger-light);}
.chip.chip-suspended.active{background:var(--danger);border-color:var(--danger);color:#fff;}
.list-card.suspended{border-left:4px solid var(--danger);}
.tag.mash{background:var(--accent-light);color:var(--accent-ink);}
.empty{text-align:center;color:var(--ink-faint);padding:36px 16px;font-size:14px;}
.empty svg{display:block;margin:0 auto 8px;opacity:.55;}
.sub{font-size:13px;color:var(--ink-soft);}

/* filters */
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;}
.toolbar .search-box{flex:1;}
.filter-btn{display:inline-flex;align-items:center;gap:6px;padding:10px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;}
.filter-btn.on{border-color:var(--primary);color:var(--primary);}
.filter-btn .n{background:var(--primary);color:#fff;border-radius:999px;font-size:11px;padding:0 7px;}
.filter-panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);padding:4px 16px 16px;margin-bottom:12px;}
.filter-panel .fp-group label{margin-top:12px;}
.filter-panel select{max-width:320px;}
.filter-summary{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.clear-all{font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--danger);}

/* pickers + modals */
.modal-overlay{position:fixed;inset:0;background:rgba(15,25,20,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
@media(min-width:640px){.modal-overlay{align-items:center;}}

function render(){
  // remember which box has the cursor so a re-render (e.g. a toast disappearing) doesn't take it away
  const a = document.activeElement, keys = ['id','data-live','data-bind'];
  const key = a && a.matches && a.matches('input,textarea') ? keys.map(k=>[k, a.getAttribute(k)]).find(([,v])=>v) : null;
  let pos = null; try{ pos = a.selectionStart; }catch(_){}
  const r = routes[state.route] || routes.dashboard;
  document.getElementById('app').innerHTML = layout(r());

  if(key){
    const el = document.querySelector(key[0]==='id' ? '#'+CSS.escape(key[1]) : `[${key[0]}="${key[1]}"]`);

      el.focus();
      const toEnd = () => { const v = el.value; el.value = ''; el.value = v; };
      try{ pos!=null ? el.setSelectionRange(pos,pos) : toEnd(); }catch(_){ toEnd(); }
    }
  }
  afterRender();
}

// the page you're on is kept in the web address (and the open tabs in this browser tab), so a refresh opens the same place
function saveLocation(){
  const h = '#' + state.route + (state.routeId ? '/' + state.routeId : '');
  try{ if(location.hash !== h) history.replaceState(null, '', h); }catch(_){}
  try{ sessionStorage.setItem('kvisa-view', JSON.stringify({dispatchTab: state.dispatchTab, msgTab: state.msgTab, msgPhone: state.msgPhone})); }catch(_){}
}

  const [route, id] = decodeURIComponent(location.hash.slice(1)).split('/');

  try{ const v = JSON.parse(sessionStorage.getItem('kvisa-view') || '{}'); for(const k of ['dispatchTab','msgTab','msgPhone']) if(k in v) state[k] = v[k]; }catch(_){}
}
function afterRender(){
  // a conversation opens at its newest message
  const bubbles = document.querySelector('.bubbles'); if(bubbles) bubbles.scrollTop = bubbles.scrollHeight;

function initials(name){ if(!name) return '?'; return name.trim().split(/\s+/).slice(0,2).map(s=>s[0]).join('').toUpperCase(); }
function byId(arr,id){ return arr.find(x=>String(x.id)===String(id)); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function streetOnly(address){
  if(!address) return '';
  let a = address.split(',')[0].trim();
  a = a.replace(/^\d+\s+/, ''); // leading house number
  a = a.replace(/\b(street|st|avenue|ave|road|rd|drive|dr|lane|ln|boulevard|blvd|court|ct|place|pl|way|terrace|ter)\.?$/i, '').trim();
  return a || address;
}
function shortLegMessage(req, leg){
  const client = byId(state.clients, req.client_id);
  const vol = byId(state.volunteers, req.volunteer_id), vol2 = byId(state.volunteers, req.volunteer2_id);
  const clientSt = streetOnly(client?.address);
  const volSt = [vol, vol2].filter(Boolean).map(v=>streetOnly(v.address)).join(' & ');
  const t = state.settings.post_message_template || {before:'',between:' to ',after:''};
  const [from,to] = leg === 'return' ? [volSt, clientSt] : [clientSt, volSt];
  return `${t.before||''}${from}${t.between||' to '}${to}${t.after||''}`;
}
function renderTemplate(tmpl, vars){
  const lines = (tmpl||'').split('\n').map(line=>{
    const keys = [...line.matchAll(/\{(\w+)\}/g)].map(m=>m[1]).filter(k=> k in vars);
    // drop a line whose placeholders all came out empty (a missing note, "Bags:" on the return leg)
    if(keys.length && keys.every(k=> vars[k]==null || String(vars[k]).trim()==='')) return null;
    return line.replace(/\{(\w+)\}/g, (m,k)=> k in vars ? vars[k] : m);
  });
  return lines.filter(l=>l!==null).join('\n');
}
function driverMessage(req, leg){
  const client = byId(state.clients, req.client_id);
  const vol = byId(state.volunteers, req.volunteer_id);
  const driver = byId(state.drivers, leg==='return' ? req.return_driver_id : req.pickup_driver_id);
  const tmpl = leg==='return' ? state.settings.driver_message_return_template : state.settings.driver_message_pickup_template;
  // a second volunteer is listed right after the first one's note
  const vol2 = byId(state.volunteers, req.volunteer2_id);
  const also = vol2 ? '\n' + [leg==='return' ? 'Also pick up from:' : 'Also deliver to:', vol2.name, vol2.address, mapUrl(vol2.address), vol2.note].filter(Boolean).join('\n') : '';
  return renderTemplate(tmpl, {
    request_id: req.id, driver_name: driver?.name||'',
    // the client's name and bag count only matter to drivers for Mashilach clients; for families the address is enough
    client_name: client?.is_mashilach ? client.name : '', client_address: client?.address||'', client_phone: client?.phone||'', client_note: client?.note||'',
    // tapping the link opens the address in the driver's maps app
    client_map: mapUrl(client?.address),
    volunteer_name: vol?.name||'', volunteer_address: vol?.address||'', volunteer_phone: vol?.phone||'', volunteer_note: [vol?.note, also].filter(Boolean).join('\n'), volunteer_map: mapUrl(vol?.address),
    // the washer packages freely on the return leg, so no bag count there
    bags: leg==='return' || !client?.is_mashilach ? '' : bagsLabel(req.bags), requested_for: fmtDateTime(req.requested_for)
  });
}
// Bag counts are stored as numbers; 4 means "4 or more"
function bagsLabel(n){ if(!n) return '—'; return Number(n)>=4 ? '4+' : String(n); }
function bagChips(){
  return ['1','2','3','4'].map(b=>`<div class="chip ${String(state.draft.bags)===b?'active':''}" data-action="set-draft" data-field="bags" data-value="${b}">${b==='4'?'4+':b}</div>`).join('');
}

  navigator.clipboard?.writeText(text).then(()=>showToast('Copied to clipboard')).catch(()=>showToast('Could not copy'));

function showToast(msg){ state.toast = msg; render(); setTimeout(()=>{ state.toast=null; render(); }, 2200); }

function volunteerReadiness(vol){
  const completedTime = r => new Date(r.completed_at || r.updated_at).getTime();
  const completed = state.requests.filter(r=>hasVolunteer(r, vol.id) && r.status==='completed')
    .sort((a,b)=> completedTime(b) - completedTime(a));
  if(completed.length===0) return 'gray';
  const last = new Date(completedTime(completed[0]));
  const days = (Date.now() - last.getTime()) / 86400000;
  const threshold = WASH_DAYS[vol.wash_frequency] || 30;
  return days <= threshold ? 'green' : 'amber';
}

async function loadAll(){
  // make sure today's recurring requests exist once it's 7 AM (the database also does this every hour)
  try{ await sb.rpc('generate_recurring_requests'); }catch(_){}
  const [c,v,d,r,s,p,inv,rec,ov,ct,cl,msg,pst,pn,off] = await Promise.all([
    sb.from('clients').select('*').order('name'),
    sb.from('volunteers').select('*').order('name'),
    sb.from('drivers').select('*').order('name'),
    sb.from('requests').select('*').order('id',{ascending:false}),
    sb.from('app_settings').select('*').eq('id',1).maybeSingle(),
    sb.from('profiles').select('*').order('email'),
    sb.from('invites').select('*').order('created_at'),
    sb.from('recurring_requests').select('*').order('id'),
    sb.from('recurring_overrides').select('*'),
    sb.from('contacts').select('*').order('name'),
    sb.from('contact_lists').select('*').order('name'),
    sb.from('messages').select('*').order('created_at',{ascending:false}).limit(2000),
    sb.from('posts').select('*').order('id',{ascending:false}).limit(20),
    sb.from('post_numbers').select('*').eq('day', todayKey()),
    sb.from('call_offers').select('*').eq('status','waiting'),
  ]);
  const failed = [c,v,d,r,s].find(x=>x.error);
  if(failed) showToast('Could not load data: ' + failed.error.message);
  state.clients = c.data||[]; state.volunteers = v.data||[]; state.drivers = d.data||[];
  state.requests = r.data||[]; state.profiles = p.data||[]; state.invites = inv.data||[]; state.recurring = rec.data||[]; state.overrides = ov.data||[];
  state.contacts = ct.data||[]; state.lists = cl.data||[]; state.messages = msg.data||[]; state.posts = pst.data||[]; state.postNumbers = pn.data||[]; state.offers = off.data||[];
  if(s.data) state.settings = { ...state.settings, ...s.data };
  state.loading = false;
  render();
  startLive();
  await revertExpiredTempInactive();
}

/* ============================= Live updates ============================= */
// every open app hears about changes made by anyone else and updates by itself
const LIVE_TABLES = { clients:'clients', volunteers:'volunteers', drivers:'drivers', requests:'requests', recurring_requests:'recurring',
  recurring_overrides:'overrides', profiles:'profiles', contacts:'contacts', contact_lists:'lists', messages:'messages', posts:'posts',
  post_numbers:'postNumbers', call_offers:'offers' };
const LIVE_KEY = { post_numbers: r=>r.day+'|'+r.number, recurring_overrides: r=>r.recurring_id+'|'+r.run_date };
const BY_NAME = ['clients','volunteers','drivers','contacts','lists'];
let liveChannel = null, liveJoined = false, liveRenderTimer = null, liveRenderWaiting = false, hiddenSince = 0;
function startLive(){
  if(liveChannel) return;
  liveChannel = sb.channel('kvisa-live');
  for(const table of Object.keys(LIVE_TABLES)) liveChannel.on('postgres_changes', {event:'*', schema:'public', table}, p=>applyLive(table, p));
  liveChannel.on('postgres_changes', {event:'UPDATE', schema:'public', table:'app_settings'}, p=>{ state.settings = {...state.settings, ...p.new}; liveRender(); });
  liveChannel.subscribe(status=>{
    // after the connection drops and comes back, load everything once to catch what was missed
    if(status==='SUBSCRIBED'){ if(liveJoined) loadAll(); liveJoined = true; }
  });
}
function stopLive(){ if(liveChannel){ sb.removeChannel(liveChannel); liveChannel = null; liveJoined = false; } }
function applyLive(table, p){
  const name = LIVE_TABLES[table], key = LIVE_KEY[table] || (r=>String(r.id));
  if(p.eventType==='DELETE'){ const k = key(p.old||{}); state[name] = state[name].filter(r=>key(r)!==k); }
  else {
    const row = p.new; if(!row) return;
    if(table==='post_numbers' && row.day !== todayKey()) return;
    const list = state[name], i = list.findIndex(r=>key(r)===key(row));
    if(i>=0) list[i] = {...list[i], ...row}; else if(table==='requests') list.unshift(row); else list.push(row);
    if(BY_NAME.includes(name)) list.sort((a,b)=>(a.name||'').localeCompare(b.name||''));
    if(table==='profiles' && row.id===state.profile?.id) state.profile = {...state.profile, ...row};
  }
  liveRender();
}
// redraw soon, but never while someone is typing in a box the screen can't restore (it waits until they leave it)
function liveRender(){
  clearTimeout(liveRenderTimer);
  liveRenderTimer = setTimeout(()=>{
    const a = document.activeElement;
    const busy = a && a.matches && a.matches('input,textarea,select') && !a.matches('[data-bind]:not(select),[data-live],[data-addr],#msg-compose,#test-reply');
    if(busy){ liveRenderWaiting = true; return; }
    liveRenderWaiting = false; render();
  }, 150);
}
document.addEventListener('focusout', ()=>{ if(liveRenderWaiting) setTimeout(()=>{ if(liveRenderWaiting) liveRender(); }, 50); });
// phones pause the connection while the app is in the background; catch up when it comes back
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden){ hiddenSince = Date.now(); return; }
  if(hiddenSince && Date.now() - hiddenSince > 30000 && state.profile && !state.loading) loadAll();
  hiddenSince = 0;
});

// Temporary Inactive volunteers go back to Active once their "until" date has passed
async function revertExpiredTempInactive(){
  const today = toLocalInputValue(new Date()).slice(0,10);
  const expired = state.volunteers.filter(v=> v.status==='temporary_inactive' && v.temp_inactive_until && v.temp_inactive_until < today);
  if(!expired.length) return;
  for(const v of expired){ await updateVolunteer(v.id, {status:'active', temp_inactive_from:null, temp_inactive_until:null}); }
  render();
}

function friendlyAuthError(error){
  const m = error?.message || String(error);
  if(/database error saving new user|not_invited|not been invited/i.test(m)) return "This email hasn't been invited yet. Ask your Editor to add it in Settings → Dispatcher access, then try again.";
  if(/invalid login credentials/i.test(m)) return 'Wrong email or password.';
  if(/email not confirmed/i.test(m)) return 'Please confirm your email first — check your inbox for the link.';
  if(/already registered/i.test(m)) return 'This email already has an account. Tap "Log in" below.';
  return m;
}

// A request is "open" while it's waiting for someone to be assigned: a volunteer, or a driver for either leg
function needsPerson(r){
  return r.status==='open' || r.status==='assigned' || r.status==='finished'
    || (r.status==='posted_pickup' && !r.pickup_driver_id) || (r.status==='posted_return' && !r.return_driver_id);
}
// kept as a list: number-like object keys would be reordered by JavaScript
const PERIODS = [['today','Today'], ['7','7 days'], ['30','30 days'], ['90','90 days'], ['365','1 year'], ['all','All time'], ['custom','Dates']];
function localDay(d){ const x = new Date(d); return new Date(x.getFullYear(), x.getMonth(), x.getDate()); }
function inPeriod(iso, period, from, to){
  if(!iso) return false;
  const d = new Date(iso);
  if(period==='all') return true;
  if(period==='today') return d.toDateString() === new Date().toDateString();
  if(period==='custom'){
    if(from && d < new Date(from + 'T00:00')) return false;
    if(to && d > new Date(to + 'T23:59:59')) return false;
    return true;
  }
  return Date.now() - d.getTime() <= Number(period) * 86400000;
}
function topCard(kind){
  const cfg = state.top[kind];
  const counts = {};
  state.requests.filter(r=>r.status==='completed' && inPeriod(r.completed_at || r.updated_at, cfg.period, cfg.from, cfg.to)).forEach(r=>{
    // volunteers: one per completed call; drivers: one per leg they drove
    const ids = kind==='volunteer' ? [r.volunteer_id, r.volunteer2_id] : [r.pickup_driver_id, r.return_driver_id];
    ids.filter(Boolean).forEach(id => counts[id] = (counts[id]||0) + 1);
  });
  const rows = Object.entries(counts).map(([id,n])=>[byId(state[kind+'s'], id), n]).filter(([p])=>p)
    .sort((a,b)=> b[1]-a[1] || a[0].name.localeCompare(b[0].name)).slice(0,10);
  return `<div class="section-card">
    <div class="section-head"><div class="section-name"><div class="icn">${icon(kind)}</div><h3>Top ${kind}s</h3></div></div>
    <div class="chip-row">${PERIODS.map(([k,l])=>`<div class="chip ${cfg.period===k?'active':''}" data-action="set-top-period" data-kind="${kind}" data-period="${k}">${l}</div>`).join('')}</div>
    ${cfg.period==='custom' ? `<div class="range-row">
      <div><label>From</label><input type="date" data-topdate="${kind}.from" value="${esc(cfg.from)}"></div>
      <div><label>To</label><input type="date" data-topdate="${kind}.to" value="${esc(cfg.to)}"></div>
    </div>` : ''}
    <div style="margin-top:10px;">
      ${rows.length ? rows.map(([p,n],i)=>`<div class="top-row"><span class="rank">${i+1}</span><span class="name-link" data-nav="${kind}" data-id="${p.id}">${esc(p.name)}</span><span class="count-pill">${n}</span></div>`).join('')
        : `<div class="empty" style="padding:14px;">&mdash;</div>`}
    </div>
  </div>`;
}

/* ============================= Dispatch ============================= */
function dayLabel(iso){
  if(!iso) return 'No date';
  const diff = Math.round((localDay(iso) - localDay(new Date())) / 86400000);
  if(diff === 0) return 'Today';
  if(diff === 1) return 'Tomorrow';
  if(diff === 2) return 'After tomorrow';
  if(diff === -1) return 'Yesterday';
  return new Date(iso).toLocaleDateString('en-US', {weekday:'long', month:'short', day:'numeric'});
}
function doneDate(r){ return r.completed_at || r.updated_at; }
// Active requests: overdue days first (oldest first), then Today, Tomorrow, After tomorrow and later days.
// Finished requests: newest first by the day they finished; only Today and Yesterday get a heading.
function groupByDay(list, finished){
  const t0 = localDay(new Date()).getTime();
  const when = r => finished ? doneDate(r) : r.requested_for;
  const day = r => when(r) ? localDay(when(r)).getTime() : Infinity;
  const sorted = list.slice().sort((a,b)=> finished
    ? new Date(when(b)) - new Date(when(a))
    : (day(a) - day(b)) || (new Date(a.requested_for) - new Date(b.requested_for)));
  const groups = [];
  sorted.forEach(r=>{
    let label = dayLabel(when(r));
    if(finished && !['Today','Yesterday'].includes(label)) label = '';
    if(!groups.length || groups[groups.length-1].label !== label) groups.push({label, items:[]});
    groups[groups.length-1].items.push(r);
  });
  return groups.map(g=>`${g.label ? `<div class="date-group-label">${esc(g.label)}</div>` : '<div style="height:12px"></div>'}<div class="${finished ? 'row-list' : 'card-grid'}">${g.items.map(requestCard).join('')}</div>`).join('');
}
const TAB_ICONS = { todo:'todo', open:'info', assigned:'volunteer', posted_pickup:'truck', delivered:'box', finished:'wash', posted_return:'truck', completed:'check', not_covered:'alert', cancelled:'x' };
// the Completed tab only keeps today's and yesterday's; older ones live in Request History
// To Do gathers every request still waiting on a dispatcher's next step
const TODO_STATUSES = ['open','assigned','posted_pickup','finished','posted_return'];
function inDispatchTab(r, tab){
  if(tab === 'todo') return TODO_STATUSES.includes(r.status);
  if(r.status !== tab) return false;
  if(tab === 'completed') return ['Today','Yesterday'].includes(dayLabel(doneDate(r)));
  return true;
}
function dispatch(){
  const tabs = ['todo', ...STATUS_FLOW, 'not_covered', 'cancelled'];
  const counts = {}; tabs.forEach(t=> counts[t] = state.requests.filter(r=>inDispatchTab(r, t)).length);
  const q = state.dispatchSearch.trim();
  let list = state.requests.filter(r=> inDispatchTab(r, state.dispatchTab));
  if(q) list = list.filter(r=> String(r.id).includes(q));
  return `
    <div class="btn btn-primary" data-action="open-modal" data-modal="newRequest">${icon('plus')} New Request</div>
    <div class="search-box" style="margin:12px 0;">${icon('search')}<input placeholder="Search by request ID…" inputmode="numeric" value="${esc(state.dispatchSearch)}" data-live="dispatchSearch"></div>
    <div class="tabs">
      ${tabs.map(t=>{
        const label = TAB_LABELS[t]||STATUS_LABELS[t];
        // empty tabs shrink to a small icon; the open tab always shows its name
        return counts[t] || state.dispatchTab===t
          ? `<div class="tab ${state.dispatchTab===t?'active':''}" data-action="dispatch-tab" data-tab="${t}">${label}${counts[t]?`<span class="count">${counts[t]}</span>`:''}</div>`
          : `<div class="tab tab-icon" data-action="dispatch-tab" data-tab="${t}" title="${label}" aria-label="${label}">${icon(TAB_ICONS[t])}</div>`;
      }).join('')}
    </div>
    ${list.length===0 ? `<div class="empty">${icon('clip')}<div>No requests in ${TAB_LABELS[state.dispatchTab]||STATUS_LABELS[state.dispatchTab]}</div></div>` : groupByDay(list, DONE.includes(state.dispatchTab))}
  `;
}

  return new Date(iso).toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric'});
}

/* ============================= Address form ============================= */
// Suggestions and checking come from Photon, a free OpenStreetMap geocoder that needs no API key
// and can be called straight from the browser (this app has no server to keep a key secret).
const GEOCODER_URL = 'https://photon.komoot.io/api/';
const ADDRESS_COUNTRY = 'US';
const US_STATES = {Alabama:'AL',Alaska:'AK',Arizona:'AZ',Arkansas:'AR',California:'CA',Colorado:'CO',Connecticut:'CT',Delaware:'DE',
  'District of Columbia':'DC',Florida:'FL',Georgia:'GA',Hawaii:'HI',Idaho:'ID',Illinois:'IL',Indiana:'IN',Iowa:'IA',Kansas:'KS',
  Kentucky:'KY',Louisiana:'LA',Maine:'ME',Maryland:'MD',Massachusetts:'MA',Michigan:'MI',Minnesota:'MN',Mississippi:'MS',Missouri:'MO',
  Montana:'MT',Nebraska:'NE',Nevada:'NV','New Hampshire':'NH','New Jersey':'NJ','New Mexico':'NM','New York':'NY','North Carolina':'NC',
  'North Dakota':'ND',Ohio:'OH',Oklahoma:'OK',Oregon:'OR',Pennsylvania:'PA','Rhode Island':'RI','South Carolina':'SC','South Dakota':'SD',
  Tennessee:'TN',Texas:'TX',Utah:'UT',Vermont:'VT',Virginia:'VA',Washington:'WA','West Virginia':'WV',Wisconsin:'WI',Wyoming:'WY',
  'Puerto Rico':'PR'};
const STATE_CODES = new Set(Object.values(US_STATES));
function stateCode(s){
  if(!s) return '';
  const t = s.trim(), up = t.toUpperCase();
  if(STATE_CODES.has(up)) return up;
  const hit = Object.keys(US_STATES).find(n => n.toLowerCase() === t.toLowerCase());
  return hit ? US_STATES[hit] : '';
}

// The database keeps one address text ("123 Main St, Apt 4, Brooklyn, NY 11211"); the form splits it into parts
function composeAddress(a, withUnit = true){
  if(!a) return '';
  const t = k => (a[k]||'').trim();
  return [t('street'), withUnit ? t('unit') : '', t('city'), [t('state').toUpperCase(), t('zip')].filter(Boolean).join(' ')].filter(Boolean).join(', ');
}
function parseAddress(s){
  const out = {street:'', unit:'', city:'', state:'', zip:''};
  if(!s) return out;
  const parts = s.split(',').map(x=>x.trim()).filter(Boolean);
  if(parts.length > 1 && /^(usa?|united states( of america)?)$/i.test(parts[parts.length-1])) parts.pop();
  if(parts.length > 1){
    // last part looks like "NY 11211", "11211", "NY" or "Brooklyn NY 11211"
    let last = parts[parts.length-1];
    const zip = last.match(/\s*\b(\d{5}(?:-\d{4})?)$/);
    if(zip) last = last.slice(0, zip.index).trim();
    const words = last.split(/\s+/);
    let st = stateCode(words[words.length-1]) ? words.pop() : '';
    if(!st && stateCode(last)){ st = last; words.length = 0; }
    if(zip || st){
      parts.pop();
      out.zip = zip ? zip[1] : ''; out.state = stateCode(st);
      out.city = words.join(' ').trim();
      if(!out.city && parts.length > 1) out.city = parts.pop();
      out.street = parts.shift() || ''; out.unit = parts.join(', ');
      return out;
    }
  }
  // anything we can't split keeps its exact text in the street box
  out.street = s.trim();
  return out;
}

// Where each address form keeps its parts: 'draft' = the open Add/Edit person form, 'mash' = the Mashilach preset in Settings
function addrHolder(key){ return key === 'mash' ? state.mashAddr : state.draft._addr; }
function newAddrHolder(address){ return {...parseAddress(address), _status:'', _sugg:[], _match:null, _dirty:false}; }
function syncAddr(key){ if(key === 'draft') state.draft.address = composeAddress(state.draft._addr); }

function featureToAddr(f){
  const p = f.properties || {};
  const road = p.street || (p.type === 'street' ? p.name : '');
  return {
    street: [p.housenumber, road].filter(Boolean).join(' '),
    city: p.city || p.town || p.village || p.locality || p.district || p.county || '',
    state: stateCode(p.state) || '', zip: (p.postcode||'').split(/[;,]/)[0].trim(),
    housenumber: p.housenumber || '', road: road || '',
    place: p.name && p.name !== road && p.type !== 'street' ? p.name : '',
  };
}
async function geocode(q, limit, signal){
  const res = await fetch(`${GEOCODER_URL}?q=${encodeURIComponent(q)}&limit=${limit}&lang=en`, {signal});
  if(!res.ok) throw new Error('geocoder ' + res.status);
  const data = await res.json();
  const seen = new Set();
  return (data.features||[])
    .filter(f => (f.properties?.countrycode||'').toUpperCase() === ADDRESS_COUNTRY)
    .map(featureToAddr)
    .filter(c => c.road && !seen.has(composeAddress(c)) && seen.add(composeAddress(c)));
}

// compare "123 N. Main Street" with "123 North Main St"
const STREET_WORDS = {street:'st',avenue:'ave',av:'ave',road:'rd',drive:'dr',lane:'ln',boulevard:'blvd',court:'ct',place:'pl',
  terrace:'ter',parkway:'pkwy',highway:'hwy',square:'sq',circle:'cir',north:'n',south:'s',east:'e',west:'w'};
function normStreet(s){
  return (s||'').toLowerCase().replace(/[.,#]/g,' ').split(/\s+/).filter(Boolean)
    .map(w => STREET_WORDS[w] || w.replace(/^(\d+)(st|nd|rd|th)$/, '$1')).join(' ');
}
function houseNumber(street){ const m = (street||'').trim().match(/^(\d+[a-z]?(?:-\d+)?)\b/i); return m ? m[1].toLowerCase() : ''; }
function sameCity(a, b){ return !a || !b || a.trim().toLowerCase() === b.trim().toLowerCase(); }

const addrTimers = {}, addrAborts = {};
function scheduleAddr(key, kind, fn, ms){
  clearTimeout(addrTimers[key+kind]);
  addrTimers[key+kind] = setTimeout(fn, ms);
}
async function suggestAddresses(key){
  const a = addrHolder(key); if(!a) return;
  const typed = (a.street||'').trim();
  if(typed.length < 3){ a._sugg = []; updateAddrUI(key); return; }
  addrAborts[key]?.abort(); const ctl = addrAborts[key] = new AbortController();
  try{
    const list = await geocode([typed, a.city, a.state, a.zip].filter(Boolean).join(' '), 10, ctl.signal);
    if(addrHolder(key) !== a || (a.street||'').trim() !== typed) return; // typed on since, or the form closed
    a._sugg = list.slice(0, 5); updateAddrUI(key);
  }catch(_){ /* no suggestions this time; checking below still reports a connection problem */ }
}
async function verifyAddress(key){
  const a = addrHolder(key); if(!a) return;
  const full = composeAddress(a, false);
  if(!a.street?.trim()){ a._status = ''; a._match = null; updateAddrUI(key); return; }
  a._status = 'checking'; updateAddrUI(key);
  let list;
  try{ list = await geocode(full, 5); }
  catch(_){ if(addrHolder(key) === a && composeAddress(a, false) === full){ a._status = 'error'; updateAddrUI(key); } return; }
  if(addrHolder(key) !== a || composeAddress(a, false) !== full) return;
  const hn = houseNumber(a.street), road = normStreet(a.street.replace(/^\s*\d+[a-z]?(?:-\d+)?\s+/i, ''));
  const zipOk = c => !a.zip || !c.zip || c.zip.slice(0,5) === a.zip.trim().slice(0,5);
  const exact = list.find(c => normStreet(c.road) === road && c.housenumber.toLowerCase() === hn && hn && zipOk(c) && sameCity(c.city, a.city));
  const streetOnlyHit = list.find(c => normStreet(c.road) === road && zipOk(c) && sameCity(c.city, a.city));
  if(exact){
    a._status = 'ok'; a._match = null;
    // fill in whatever was left out (ZIP, state, city) from the match
    let filled = false;
    for(const k of ['city','state','zip']) if(!(a[k]||'').trim() && exact[k]){ a[k] = exact[k]; filled = true; }
    if(filled){ syncAddr(key); render(); return; }
  } else if(streetOnlyHit){
    // OpenStreetMap doesn't list every house number, so a known street with a typed number is good enough
    a._status = hn ? 'street' : 'nonumber'; a._match = null;
  } else if(list.length){
    // keep the house number that was typed when the match is just the street
    const best = {...(list.find(c => hn && c.housenumber.toLowerCase() === hn) || list[0])};
    if(!best.housenumber && hn){ best.housenumber = hn; best.street = `${hn} ${best.road}`; }
    a._status = 'suggest'; a._match = best;
  } else { a._status = 'notfound'; a._match = null; }
  updateAddrUI(key);
}

function addrSuggHtml(key){
  const a = addrHolder(key);
  if(!a?._sugg?.length) return '';
  return a._sugg.map((c,i)=>`<div class="addr-opt" data-action="pick-address" data-key="${key}" data-i="${i}">
      ${esc(c.place ? `${c.place} · ${c.street}` : c.street)}<div class="sub">${esc([c.city, [c.state, c.zip].filter(Boolean).join(' ')].filter(Boolean).join(', '))}</div></div>`).join('')
    + `<div class="addr-credit">Addresses © OpenStreetMap contributors</div>`;
}
function addrStatusHtml(key){
  const a = addrHolder(key);
  switch(a?._status){
    case 'checking': return ['muted', 'Checking address…'];
    case 'ok': return ['ok', `${icon('check')} Address verified`];
    case 'street': return ['ok', `${icon('check')} Street verified`];
    case 'nonumber': return ['warn', `${icon('alert')} Street found — add the house number`];
    case 'suggest': return ['warn', `${icon('alert')} <span>Couldn't verify this exact address. Did you mean <b>${esc(composeAddress(a._match))}</b>?<a data-action="use-address-match" data-key="${key}">Use this</a></span>`];
    case 'notfound': return ['bad', `${icon('alert')} Address not found`];
    case 'error': return ['muted', `Couldn't check the address`];
    default: return ['', ''];
  }
}
// update the suggestion list and status line in place, so typing isn't interrupted by a full re-render
function updateAddrUI(key){
  const sugg = document.getElementById(`addr-${key}-sugg`);
  if(sugg) sugg.innerHTML = addrSuggHtml(key);
  const st = document.getElementById(`addr-${key}-status`);
  if(st){ const [cls, html] = addrStatusHtml(key); st.className = 'addr-status ' + cls; st.innerHTML = html; }
}
function addressFields(key, label = 'Address'){
  const a = addrHolder(key);
  if(a && !a._checked){ a._checked = true; if(a.street) setTimeout(()=>verifyAddress(key), 0); }
  const input = (part, lbl, extra='') => `<div class="field"><label>${lbl}</label><input id="addr-${key}-${part}" data-addr="${part}" autocomplete="off" value="${esc(a?.[part]||'')}" ${extra}></div>`;
  const [cls, html] = addrStatusHtml(key);
  return `<div class="addr-block" data-addr-key="${key}">
    <div class="field addr-street"><label>${label}</label>
      <input id="addr-${key}-street" data-addr="street" autocomplete="off" autocorrect="off" value="${esc(a?.street||'')}">
      <div class="addr-sugg" id="addr-${key}-sugg">${addrSuggHtml(key)}</div>
    </div>
    ${input('unit', 'Apt / Unit')}
    ${input('city', 'City')}
    <div class="addr-zip-row">
      ${input('state', 'State', 'maxlength="2" autocapitalize="characters"')}

function onAddrInput(el){
  const key = el.closest('[data-addr-key]')?.getAttribute('data-addr-key');
  const a = addrHolder(key); if(!a) return;
  const part = el.getAttribute('data-addr');
  a[part] = part === 'state' ? el.value.toUpperCase() : el.value;
  if(part === 'state' && el.value !== a[part]){ const p = el.selectionStart; el.value = a[part]; try{ el.setSelectionRange(p,p); }catch(_){} }
  a._dirty = true;
  syncAddr(key);
  if(part === 'unit') return; // the apt/unit isn't part of the check, so a verified address stays verified
  a._status = ''; a._match = null;
  if(part === 'street') scheduleAddr(key, 's', ()=>suggestAddresses(key), 300);
  else { a._sugg = []; clearTimeout(addrTimers[key+'s']); addrAborts[key]?.abort(); } // moved on from the street: a late answer shouldn't reopen the list
  updateAddrUI(key);
  scheduleAddr(key, 'v', ()=>verifyAddress(key), 1200);
}
function pickAddress(key, i){
  const a = addrHolder(key), c = a?._sugg?.[i]; if(!c) return;
  clearTimeout(addrTimers[key+'s']); clearTimeout(addrTimers[key+'v']); // the pick replaces whatever was still waiting to be looked up
  const hn = houseNumber(a.street);
  // a street-only suggestion keeps the house number that was already typed
  const street = !c.housenumber && hn ? `${hn} ${c.road}` : c.street;
  Object.assign(a, {street, city:c.city, state:c.state, zip:c.zip, _sugg:[], _match:null, _dirty:true, _status: c.housenumber ? 'ok' : ''});
  syncAddr(key); render();
  if(!c.housenumber){ verifyAddress(key); if(!hn) document.getElementById(`addr-${key}-street`)?.focus(); }
  else if(!a.unit) document.getElementById(`addr-${key}-unit`)?.focus();
}
function useAddressMatch(key){
  const a = addrHolder(key), m = a?._match; if(!m) return;
  clearTimeout(addrTimers[key+'v']);
  Object.assign(a, {street:m.street, city:m.city || a.city, state:m.state || a.state, zip:m.zip || a.zip, _match:null, _dirty:true});
  syncAddr(key); render(); verifyAddress(key);
}
function closeAddrSuggestions(except){
  for(const key of ['draft','mash']){
    const a = addrHolder(key);
    if(key !== except && a?._sugg?.length){ a._sugg = []; updateAddrUI(key); }
  }
}
// Before saving: an address that was changed but couldn't be verified needs a second look
async function confirmAddress(key){
  const a = addrHolder(key);
  if(!a || !a._dirty || !composeAddress(a)) return true;
  clearTimeout(addrTimers[key+'v']);
  if(!['ok','street','nonumber','suggest','notfound','error'].includes(a._status)) await verifyAddress(key);
  if(['ok','street','error'].includes(a._status)) return true;
  const why = a._status === 'nonumber' ? 'It has no house number.'
    : a._status === 'suggest' ? `Did you mean:\n${composeAddress(a._match)}`
    : 'It could not be found on the map.';
  return confirm(`Please check this address:\n\n${composeAddress(a)}\n\n${why}\n\nSave it anyway?`);
}

function statusBadgeInteractive(r){

/* ============================= Lists, search and filters ============================= */
// a volunteer "took a call" when they were put on a request that wasn't cancelled or left uncovered
function hasVolunteer(r, id){ return r.volunteer_id===id || r.volunteer2_id===id; }
function volunteerCalls(id){ return state.requests.filter(r=>hasVolunteer(r, id) && !['cancelled','not_covered'].includes(r.status)); }
function lastCall(id){ return Math.max(0, ...volunteerCalls(id).map(r=> new Date(r.volunteer_assigned_at || r.requested_for || r.created_at).getTime())); }
function callCount(id){ return volunteerCalls(id).length; }
function completedCount(kind, id){
  if(kind==='driver') return state.requests.filter(r=>r.status==='completed' && (r.pickup_driver_id===id || r.return_driver_id===id)).length;
  if(kind==='volunteer') return state.requests.filter(r=>r.status==='completed' && hasVolunteer(r, id)).length;
  return state.requests.filter(r=>r.status==='completed' && r[kind+'_id']===id).length;
}
function countPill(n){ return `<span class="count-pill ${n?'':'zero'}" title="Completed">${icon('check')} ${n}</span>`; }
function matchesSearch(p, q){
  if(!q) return true; q = q.toLowerCase();
  return [p.name, p.phone, p.address].some(x => (x||'').toLowerCase().includes(q));
}
function lastCallLabel(id){ const t = lastCall(id); return t ? 'Last call: ' + new Date(t).toLocaleDateString('en-US',{month:'short',day:'numeric'}) : 'No calls yet'; }
function volunteerSub(v){
  return [lastCallLabel(v.id), v.phone, daysLabel(v) && `Available: ${daysLabel(v)}`, v.bag_capacity && capacityLabel(v.bag_capacity)].filter(Boolean).join(' · ');
}
// readiness: green = ready, amber = due, gray = no completed washes yet
const READY_LABEL = { green:'Ready', amber:'Due', gray:'New' };

// What each list can be filtered and sorted by. Every group allows several choices at once.
const FILTERS = {
  clients: {
    groups: [
      { key:'status', label:'Status', options:[['active','Active'],['inactive','Inactive'],['suspended','Suspended']], test:(c,v)=>v.includes(c.status) },
      { key:'mash', label:'Mashilach', options:[['yes','Mashilach'],['no','Not Mashilach']], test:(c,v)=>v.includes(c.is_mashilach?'yes':'no') },
    ],
    sorts: { name:'Name (A–Z)', most:'Most completed', newest:'Newest first' },
  },
  volunteers: {
    groups: [
      { key:'status', label:'Status', options:[['active','Active'],['inactive','Inactive'],['temporary_inactive','Temp. Inactive'],['suspended','Suspended']], test:(x,v)=>v.includes(x.status) },
      { key:'days', label:'Available on', options: WORK_DAYS.map(i=>[i, DAY_SHORT[i]]), test:null }, // sorts matches to the top instead of hiding others
      { key:'capacity', label:'Bag capacity', options:[['1',capacityLabel('1')],['2',capacityLabel('2')],['3',capacityLabel('3')],['4plus',capacityLabel('4plus')]], test:(x,v)=>v.includes(x.bag_capacity) },
      { key:'freq', label:'Wash frequency', options:Object.entries(WASH_FREQ), test:(x,v)=>v.includes(x.wash_frequency) },
      { key:'ready', label:'Readiness', options:Object.entries(READY_LABEL), test:(x,v)=>v.includes(volunteerReadiness(x)) },
    ],
    sorts: { rotation:'Longest since last call', name:'Name (A–Z)', readiness:'Due to wash first', capacity:'Most bags first', frequency:'Washes most often first', most:'Most completed', newest:'Newest first' },
  },
  drivers: {
    groups: [
      { key:'status', label:'Status', options:[['active','Active'],['inactive','Inactive'],['suspended','Suspended']], test:(d,v)=>v.includes(d.status) },
      { key:'contact', label:'Contact method', options:[['sms','SMS'],['whatsapp','WhatsApp']], test:(d,v)=>v.some(m=>d['contact_'+m]) },
    ],
    sorts: { name:'Name (A–Z)', most:'Most completed', newest:'Newest first' },
  },
};
function defaultFilters(list){ return { status:['active'], sort: list==='volunteers' ? 'rotation' : 'name', ...(list==='volunteers' ? {days: []} : {}) }; }
function filterCount(list){
  const f = state.filters[list], d = defaultFilters(list);
  return FILTERS[list].groups.filter(g=>JSON.stringify((f[g.key]||[]).slice().sort()) !== JSON.stringify((d[g.key]||[]).slice().sort())).length + (f.sort !== d.sort ? 1 : 0);
}
function sortPeople(list, kind, sort, days){
  const rank = {amber:0, gray:1, green:2};
  const cap = v => ({'1':1,'2':2,'3':3,'4plus':4}[v.bag_capacity]||0);
  const freq = v => ({weekly:4,three_monthly:3,twice_monthly:2,once_monthly:1}[v.wash_frequency]||0);
  const byName = (a,b) => a.name.localeCompare(b.name);
  const cmp = {
    name: byName,
    readiness: (a,b) => (rank[volunteerReadiness(a)] - rank[volunteerReadiness(b)]) || byName(a,b),
    capacity: (a,b) => (cap(b) - cap(a)) || byName(a,b),
    frequency: (a,b) => (freq(b) - freq(a)) || byName(a,b),
    most: (a,b) => (completedCount(kind,b.id) - completedCount(kind,a.id)) || byName(a,b),
    newest: (a,b) => new Date(b.created_at) - new Date(a.created_at),
    // never had a call (fewest calls first), then whoever's last call was longest ago; the latest one goes to the bottom
    rotation: (a,b) => (lastCall(a.id) - lastCall(b.id)) || (callCount(a.id) - callCount(b.id)) || byName(a,b),
  }[sort] || byName;
  // volunteers free on more of the chosen days come first; the chosen sort orders the rest
  const free = v => (days||[]).filter(d=>availableOn(v,d)).length;
  return list.slice().sort((a,b)=> (free(b) - free(a)) || cmp(a,b));
}
function applyFilters(list, kind){
  const listName = kind+'s', f = state.filters[listName];
  let out = list.filter(p => matchesSearch(p, f.q));
  FILTERS[listName].groups.forEach(g=>{ if(g.test && (f[g.key]||[]).length) out = out.filter(p=>g.test(p, f[g.key])); });
  return sortPeople(out, kind, f.sort, f.days);
}
function filterPanel(listName){

function volunteers(){
  const days = state.filters.volunteers.days || [];

/* ============================= Recurring requests ============================= */
function isEditor(){ return state.profile?.role === 'editor'; }
function fmtTime(t){ if(!t) return ''; const [h,m] = t.split(':').map(Number); return new Date(2000,0,1,h,m).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}); }
function daysText(days){ return (days||[]).slice().sort().map(i=>DAY_SHORT[i]).join(', '); }
function ymd(d){ const x = new Date(d); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`; }
const ORDINAL = {1:'1st', 2:'2nd', 3:'3rd', 4:'4th', 5:'Last'};
// same rule as recurring_occurs() in the database
function occursOn(t, day){
  const d = localDay(day);
  if(t.start_date && d < localDay(t.start_date + 'T00:00')) return false;
  if(!(t.days||[]).includes(d.getDay())) return false;
  if(t.repeat === 'monthly'){
    const n = Math.floor((d.getDate()-1)/7) + 1;
    const next = new Date(d); next.setDate(d.getDate()+7);
    return (t.month_weeks||[]).includes(n) || ((t.month_weeks||[]).includes(5) && next.getMonth() !== d.getMonth());
  }
  // count weeks from the first chosen day on or after the start date
  const start = localDay((t.start_date || ymd(new Date())) + 'T00:00');
  const first = new Date(start); first.setDate(start.getDate() + Math.min(...(t.days||[]).map(dd => (dd - start.getDay() + 7) % 7)));
  const weekOf = x => { const y = new Date(x); y.setDate(y.getDate() - y.getDay()); return y; };
  const weeks = Math.round((weekOf(d) - weekOf(first)) / (7*86400000));
  return weeks % (t.interval_weeks || 1) === 0;
}
function describeRepeat(t){
  const days = daysText(t.days) || '—';
  if(t.repeat === 'monthly') return `${(t.month_weeks||[]).slice().sort().map(n=>ORDINAL[n]).join(' & ') || '—'} ${days} of the month`;
  return (t.interval_weeks||1) > 1 ? `Every ${t.interval_weeks} weeks on ${days}` : `Every ${days}`;
}
function overrideFor(t, day){ return state.overrides.find(o=>o.recurring_id===t.id && o.run_date===ymd(day)); }
// who is set for one date: the one-time change if there is one, otherwise the usual person
function effectiveFor(t, day, field){
  const o = overrideFor(t, day); if(o && field in (o.changes||{})) return o.changes[field];
  const dp = (t.day_people||{})[localDay(day).getDay()]; if(dp && field in dp) return dp[field];
  return t[field];
}
const RECURRING_PEOPLE = [['volunteer_id','Volunteer','volunteer','_showVol'], ['pickup_driver_id','Pickup driver','driver','_showPd'], ['return_driver_id','Return driver','driver','_showRd']];
function isPerDay(t){ return Object.keys(t.day_people||{}).length > 0; }
// the request already created from a recurring one for a given day (if any)
function generatedFor(t, day){ return state.requests.find(r=>r.recurring_id===t.id && r.requested_for && localDay(r.requested_for).getTime()===day.getTime()); }
function recurringCard(t){
  const client = byId(state.clients, t.client_id), vol = byId(state.volunteers, t.volunteer_id);
  const pd = byId(state.drivers, t.pickup_driver_id), rd = byId(state.drivers, t.return_driver_id);
  const dayAttr = day => day == null ? '' : ` data-day="${day}"`;
  const assign = (field, label, primary, day) => `<button class="btn ${primary?'btn-primary':'btn-outline'}" data-action="assign-person" data-recurring="1" data-id="${t.id}" data-field="${field}"${dayAttr(day)}>${icon(field==='volunteer_id'?'volunteer':'truck')} ${label}</button>`;
  const box = (role, kind, p, field, day) => personBox(role, kind, p, {address: kind==='volunteer'}).replace('<span class="role">',
    `<button class="box-x" title="Remove" data-action="unassign-recurring" data-id="${t.id}" data-field="${field}"${dayAttr(day)}>${icon('x')}</button><span class="role">`);
  const perDay = isPerDay(t);
  const missing = perDay ? '' : [!vol && assign('volunteer_id','Assign Volunteer', true), !pd && assign('pickup_driver_id','Assign Pickup Driver'), !rd && assign('return_driver_id','Assign Return Driver')].filter(Boolean).join('');
  // different people on each weekday: one small block per day
  const perDayBlocks = perDay ? (t.days||[]).slice().sort().map(day => {
    const dp = (t.day_people||{})[day] || {};
    const people = RECURRING_PEOPLE.map(([f, role, kind]) => [f, role, kind, byId(state[kind+'s'], dp[f])]);
    return `<div class="day-block"><div class="day-name">${DAY_LONG[day]}</div>
      ${people.filter(x=>x[3]).map(([f, role, kind, p]) => box(role, kind, p, f, day)).join('')}
      ${people.some(x=>!x[3]) ? `<div class="req-actions" style="margin-top:8px;">${people.filter(x=>!x[3]).map(([f, role]) => assign(f, 'Assign ' + role, f==='volunteer_id', day)).join('')}</div>` : ''}
    </div>`;
  }).join('') : '';
  return `<div class="card req-card" style="border-left-color:${t.active ? 'var(--primary)' : 'var(--line)'};${t.active ? '' : 'opacity:.65;'}">
    <div class="req-head">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;"><span class="req-id">${icon('repeat')} ${esc(describeRepeat(t))}</span><span class="sub">${fmtTime(t.time_of_day)}</span>${t.active ? '' : '<span class="tag gray">Paused</span>'}</div>
      ${isEditor() ? `<div class="req-tools">
        <button class="icon-only" title="Edit" data-action="open-modal" data-modal="recurringForm" data-id="${t.id}">${ICON_EDIT}</button>
        <button class="icon-only danger" title="Delete" data-action="delete-recurring" data-id="${t.id}">${ICON_TRASH}</button>
      </div>` : ''}
    </div>
    ${client ? `<div class="req-line">${icon('client')} <span class="name-link" data-nav="client" data-id="${client.id}">${esc(client.name)}</span>${client.phone ? ` &middot; ${telLink(client.phone)}` : ''}</div>
      ${client.address ? `<div class="req-line">${icon('pin')} ${mapLink(client.address)}</div>` : ''}` : ''}
    <div class="req-line">${icon('bag')} ${bagsLabel(t.bags)} bag's</div>
    ${perDay ? perDayBlocks : `${vol ? box('Volunteer','volunteer',vol,'volunteer_id') : ''}
    ${pd ? box('Pickup driver','driver',pd,'pickup_driver_id') : ''}
    ${rd ? box('Return driver','driver',rd,'return_driver_id') : ''}`}
    ${t.notes ? `<div class="private">${esc(t.notes)}</div>` : ''}
    ${missing || isEditor() ? `<div class="req-actions">${missing}${isEditor() ? `<button class="btn btn-outline" data-action="toggle-recurring-active" data-id="${t.id}">${t.active ? 'Pause' : 'Resume'}</button>` : ''}</div>` : ''}
  </div>`;
}
function recurring(){
  const today = localDay(new Date());
  const week = [];
  for(let i=0;i<7;i++){
    const day = new Date(today); day.setDate(today.getDate()+i);
    const items = state.recurring.filter(t=>t.active && occursOn(t, day))
      .sort((a,b)=> (a.time_of_day||'').localeCompare(b.time_of_day||''));
    if(items.length) week.push({day, items});
  }
  const row = (t, day) => {
    const c = byId(state.clients, t.client_id), v = byId(state.volunteers, effectiveFor(t, day, 'volunteer_id'));
    const made = generatedFor(t, day), ov = overrideFor(t, day);
    const changed = ov && Object.keys(ov.changes||{}).length;
    return `<div class="req-row" ${made ? `data-action="go-request" data-id="${made.id}"` : `data-action="open-modal" data-modal="occurrence" data-id="${t.id}" data-date="${ymd(day)}"`} style="${ov?.skip ? 'opacity:.55;' : ''}">
      <span class="sub" style="min-width:62px;">${fmtTime(t.time_of_day)}</span>
      <span class="row-text"><b>${esc(c?.name||'—')}</b>${v ? ` &middot; ${esc(v.name)}` : ''}</span>
      ${made ? `<span class="tag">#${made.id} in Dispatch</span>` : ov?.skip ? `<span class="tag gray">Skipped</span>` : changed ? `<span class="tag mash">Changed</span>` : `<span class="tag gray">Not yet</span>`}
    </div>`;
  };
  return `<div class="page-head"><h2>Recurring Requests</h2></div>
    <div class="section-card" style="margin-top:0;">
      <div class="section-head"><div class="section-name"><div class="icn">${icon('calendar')}</div><h3>This week</h3></div></div>
      ${week.length ? week.map(w=>`<div class="date-group-label" style="margin:12px 0 6px;">${esc(dayLabel(w.day))}</div>${w.items.map(t=>row(t, w.day)).join('')}`).join('')
        : `<div class="empty" style="padding:14px;">&mdash;</div>`}
    </div>
    <div class="date-group-label">All recurring requests</div>
    ${state.recurring.length ? `<div class="card-grid">${state.recurring.slice().sort((a,b)=> (b.active - a.active) || ((byId(state.clients,a.client_id)?.name||'').localeCompare(byId(state.clients,b.client_id)?.name||''))).map(recurringCard).join('')}</div>`
      : `<div class="empty">${icon('repeat')}<div>No recurring requests yet</div></div>`}`;
}
