// phone numbers are compared by their last 10 digits
function normPhone(p){ const d = String(p||'').replace(/\D/g,''); return d.length >= 10 ? d.slice(-10) : d; }
function fmtPhone(p){ const d = normPhone(p); return d.length===10 ? `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}` : String(p||''); }
const PEOPLE_KINDS = [['driver','Driver'], ['volunteer','Volunteer'], ['client','Client'], ['contact','Other']];
function kindLabel(k){ return (PEOPLE_KINDS.find(x=>x[0]===k)||[])[1] || 'Phone'; }
// everyone in the app who has a phone number
function everyone(){
  return PEOPLE_KINDS.flatMap(([kind])=> (state[kind+'s']||[]).filter(p=>normPhone(p.phone).length===10)
    .map(p=>({kind, id:p.id, name:p.name, phone:normPhone(p.phone), status:p.status||'active'})));
}
function whoIs(phone){ const n = normPhone(phone); return everyone().find(p=>p.phone===n) || null; }
function personByRef(m){
  if(m.kind==='phone') return {kind:'phone', phone:normPhone(m.phone), name:fmtPhone(m.phone)};
  const p = byId(state[m.kind+'s']||[], m.id);
  return p && normPhone(p.phone).length===10 ? {kind:m.kind, id:p.id, name:p.name, phone:normPhone(p.phone), status:p.status||'active'} : null;
}
const BUILTIN_LISTS = [
  ['drivers', 'All active drivers', ()=> everyone().filter(p=>p.kind==='driver' && p.status==='active')],
  ['volunteers', 'All active volunteers', ()=> everyone().filter(p=>p.kind==='volunteer' && p.status==='active')],
];
function allLists(){ return [...BUILTIN_LISTS.map(([id,name])=>({id, name, builtin:true})), ...state.lists.slice().sort((a,b)=>a.name.localeCompare(b.name))]; }
function listPeople(id){
  const b = BUILTIN_LISTS.find(l=>l[0]===String(id)); if(b) return b[2]();
  const l = byId(state.lists, id); return l ? (l.members||[]).map(personByRef).filter(Boolean) : [];
}
function listName(id){ return allLists().find(l=>String(l.id)===String(id))?.name || ''; }
function fmtMsgTime(iso, withTime){
  const d = new Date(iso), days = Math.round((localDay(new Date()) - localDay(d)) / 86400000);
  const t = d.toLocaleTimeString('en-US',{hour:'numeric', minute:'2-digit'});
  const day = days===0 ? '' : days===1 ? 'Yesterday' : d.toLocaleDateString('en-US',{month:'short', day:'numeric'});
  return !day ? t : withTime ? `${day}, ${t}` : day;
}
function linkify(text){ return esc(text).replace(/https?:\/\/[^\s<]+/g, u=>`<a href="${u}" target="_blank" rel="noopener">${u}</a>`).replace(/\n/g,'<br>'); }

function conversations(){
  const byPhone = {};
  for(const m of state.messages) (byPhone[m.phone] ||= []).push(m);
  return Object.entries(byPhone).map(([phone, msgs])=>{
    msgs.sort((a,b)=> new Date(a.created_at) - new Date(b.created_at));
    // posts go out to everyone, so they don't bring a conversation to the top (they have their own Posts chat)
    const talk = msgs.filter(m=>!m.post_id && !m.list_key);
    return talk.length ? {phone, msgs, last: talk[talk.length-1], unread: msgs.filter(m=>m.direction==='in' && !m.read_at).length, who: whoIs(phone)} : null;
  }).filter(Boolean).sort((a,b)=> new Date(b.last.created_at) - new Date(a.last.created_at));
}
function unreadCount(){ return state.messages.filter(m=>m.direction==='in' && !m.read_at).length; }

/* ---------- Posting calls to drivers ---------- */
// every call that still needs a driver: pickups once a volunteer is set, returns once washing is finished
function callsToPost(){
  const out = [];
  for(const r of state.requests){
    if(['assigned','posted_pickup'].includes(r.status) && r.volunteer_id && !r.pickup_driver_id) out.push({r, leg:'pickup'});
    if(['finished','posted_return'].includes(r.status) && !r.return_driver_id) out.push({r, leg:'return'});
  }
  return out.sort((a,b)=> new Date(a.r.requested_for||a.r.created_at) - new Date(b.r.requested_for||b.r.created_at));
}
// a call keeps the same number all day, so replies to an older post still match
function todayKey(){ return ymd(new Date()); }
function postNumber(r, leg){ return state.postNumbers.find(n=>n.day===todayKey() && n.request_id===r.id && n.leg===leg)?.number || null; }
function openLeg(r){
  if(['assigned','posted_pickup'].includes(r.status) && !r.pickup_driver_id) return 'pickup';
  if(['finished','posted_return'].includes(r.status) && !r.return_driver_id) return 'return';
  return null;
}
function dayNote(r){
  if(!r.requested_for) return '';
  const d = localDay(r.requested_for);
  return d.getTime()===localDay(new Date()).getTime() ? '' : ` (${DAY_SHORT[d.getDay()]})`;
}
function postText(items){
  const s = state.settings;
  const lines = items.map(i=>{ const r = byId(state.requests, i.request_id); return `${i.n}) ${shortLegMessage(r, i.leg)}${dayNote(r)}`; });
  return [s.post_header, ...lines].filter(x=>x && x.trim()).join('\n') + (s.post_footer ? `\n\n${s.post_footer}` : '');
}
function offersFor(r, leg){ return state.offers.filter(o=>o.request_id===r.id && o.leg===leg && o.status==='waiting'); }

async function sendTexts(rows){
  if(!rows.length) return [];
  const status = outStatus();
  const {data, error} = await sb.from('messages').insert(rows.map(r=>({direction:'out', status, sent_by: state.profile?.id, ...r, phone: normPhone(r.phone)}))).select();
  if(error){ showToast(error.message); return []; }
  state.messages.push(...data); return data;
}
// test mode works like the real thing, except nothing leaves the app
function testMode(){ return !state.settings.sms_connected && state.settings.sms_test; }
function outStatus(){ return state.settings.sms_connected ? 'queued' : testMode() ? 'test' : 'not_sent'; }
function sentWord(n){ return state.settings.sms_connected || testMode() ? (n===1 ? 'Sent' : `Sent to ${n}`) : 'Saved · texting not connected'; }
async function reloadMessaging(){
  const [msg, off] = await Promise.all([
    sb.from('messages').select('*').order('created_at',{ascending:false}).limit(2000),
    sb.from('call_offers').select('*').eq('status','waiting'),
  ]);
  if(msg.data) state.messages = msg.data; if(off.data) state.offers = off.data;
}
// test mode: type what this person would text back; it is handled exactly like a real incoming text
async function testReply(phone){
  const el = document.getElementById('test-reply'), body = (el?.value||'').trim(); if(!body) return;
  const {data, error} = await sb.rpc('receive_text', {p_phone: phone, p_body: body});
  if(error){ showToast(error.message); return; }
  state.testReply = ''; await reloadMessaging(); await markRead(phone); // it's on screen, so it's read
  if(data?.advanced){ const {data:reqs} = await sb.from('requests').select('*').order('id',{ascending:false}); if(reqs) state.requests = reqs; }
  showToast(data?.advanced ? 'Marked as done' : data?.offers ? `Asked for ${data.offers===1 ? 'a call' : data.offers+' calls'} · see Post` : data?.replies ? 'Answered automatically' : 'Received');
}
async function markRead(phone){
  const unread = state.messages.filter(m=>m.phone===phone && m.direction==='in' && !m.read_at);
  if(!unread.length) return;
  const now = new Date().toISOString();
  await sb.from('messages').update({read_at: now}).eq('phone', phone).eq('direction', 'in');
  unread.forEach(m=>m.read_at = now); render();
}
async function sendPost(){
  const m = state.modal, d = state.draft, day = todayKey();
  const fresh = m.items.filter(i=>i.isNew).map(i=>({day, number:i.n, request_id:i.request_id, leg:i.leg}));
  if(fresh.length){
    const {data, error} = await sb.from('post_numbers').insert(fresh).select();
    if(error){
      // someone else posted at the same moment; reload the numbers and start over
      const {data:nums} = await sb.from('post_numbers').select('*').eq('day', day); state.postNumbers = nums||[];
      state.modal = null; showToast('The numbers changed. Please open it again.'); return;
    }
    state.postNumbers.push(...data);
  }
  const people = listPeople(d.list);
  const post = await createRow('posts', {body: d.text, kind: m.kind, recipients: people.length, created_by: state.profile?.id}); if(!post) return;
  state.posts.unshift(post);
  await sendTexts(people.map(p=>({phone:p.phone, body:d.text, post_id:post.id})));
  // a posted call moves on to Posted
  for(const i of m.items){
    const r = byId(state.requests, i.request_id);
    if(r && r.status === (i.leg==='return' ? 'finished' : 'assigned')) await updateRequest(r.id, {status: i.leg==='return' ? 'posted_return' : 'posted_pickup'});
  }
  state.modal = null; state.draft = {};
  showToast(state.settings.sms_connected || testMode() ? `Posted to ${people.length}` : 'Saved · texting not connected');
}
async function acceptOffer(id){
  const o = byId(state.offers, id), r = o && byId(state.requests, o.request_id); if(!r) return;
  const driver = (o.driver_id && byId(state.drivers, o.driver_id)) || state.drivers.find(d=>normPhone(d.phone)===o.phone);
  if(!driver){
    // a number that isn't a driver yet: add them first, then Accept again
    state.modal = {type:'addDriver'}; state.draft = {}; state.modalStack = []; state.pendingPrefill = {phone: fmtPhone(o.phone), name: whoIs(o.phone)?.name || ''};
    render(); return;
  }
  const n = postNumber(r, o.leg), others = offersFor(r, o.leg).filter(x=>x.id!==o.id);
  await assignToRequest(r.id, o.leg==='return' ? 'return_driver_id' : 'pickup_driver_id', driver.id);
  const now = new Date().toISOString(), me = state.profile?.id;
  await sb.from('call_offers').update({status:'accepted', driver_id:driver.id, decided_by:me, decided_at:now}).eq('id', o.id);
  for(const x of others) await sb.from('call_offers').update({status:'declined', decided_by:me, decided_at:now}).eq('id', x.id);
  state.offers = state.offers.map(x=> x.id===o.id ? {...x, status:'accepted'} : others.includes(x) ? {...x, status:'declined'} : x);
  const fresh = byId(state.requests, r.id);
  await sendTexts([
    {phone:o.phone, body: driverMessage(fresh, o.leg), request_id:r.id},
    ...others.map(x=>({phone:x.phone, body:`Sorry, ${n ? '#'+n : 'this call'} was already taken. Thank you!`, request_id:r.id})),
  ]);
  showToast(`${driver.name} got ${n ? '#'+n : '#'+r.id}`);
}
async function saveList(){
  const d = state.draft, id = state.modal.id, name = (d.name||'').trim();
  if(!name){ showToast('Name is required'); return; }
  const payload = {name, members: d.members.filter(m=>personByRef(m)), updated_at: new Date().toISOString()};
  const saved = id ? await updateRow('contact_lists', id, payload) : await createRow('contact_lists', payload); if(!saved) return;
  state.lists = state.lists.filter(l=>l.id!==saved.id).concat(saved); state.modal = null; state.draft = {}; showToast('Saved');
}
async function saveContact(){
  const d = state.draft, id = state.modal.id, name = (d.name||'').trim(), phone = normPhone(d.phone);
  if(!name){ showToast('Name is required'); return; }
  if(phone.length !== 10){ showToast('Enter a 10-digit phone number'); return; }
  const payload = {name, phone: fmtPhone(phone), note: (d.note||'').trim() || null};
  const saved = id ? await updateRow('contacts', id, payload) : await createRow('contacts', payload); if(!saved) return;
  state.contacts = state.contacts.filter(c=>c.id!==saved.id).concat(saved).sort((a,b)=>a.name.localeCompare(b.name));
  state.modal = null; state.draft = {}; showToast('Saved');
}

/* ---------- Messages pages ---------- */
function messagesPage(){
  const tabs = [['inbox','Inbox', unreadCount()], ['post','Post', state.offers.filter(o=>o.status==='waiting').length], ['lists','Lists', 0], ['contacts','Contacts', 0]];
  const view = {inbox: inboxView, post: postView, lists: listsView, contacts: contactsView}[state.msgTab] || inboxView;
  return `${state.settings.sms_connected ? '' : `<div style="margin-bottom:10px;"><span class="tag ${testMode() ? 'mash' : 'gray'}">${icon('alert')} ${testMode() ? 'Test mode · nothing is texted' : 'Texting not connected'}</span></div>`}
    <div class="tabs">${tabs.map(([k,l,n])=>`<div class="tab ${state.msgTab===k?'active':''}" data-action="msg-tab" data-tab="${k}">${l}${n?`<span class="count">${n}</span>`:''}</div>`).join('')}</div>
    ${view()}`;
}
// letters only, so "Shimon (warehouse)" shows SW
function avatarFor(who){ return `<div class="conv-avatar">${who && who.kind!=='phone' ? esc(initials(who.name.replace(/[^\p{L}\s]/gu, ' '))) : icon('user')}</div>`; }
function convRow(c){
  const preview = c.last.body.split('\n').filter(l=>l.trim()).join(' ');
  return `<div class="conv-row ${c.unread?'unread':''} ${state.msgPhone===c.phone?'active':''}" data-action="open-thread" data-phone="${c.phone}">
    ${avatarFor(c.who)}
    <div class="conv-main">
      <div class="conv-top"><b>${esc(c.who?.name || fmtPhone(c.phone))}</b><span class="conv-time">${fmtMsgTime(c.last.created_at)}${icon('chev')}</span></div>
      <div class="conv-snip">${c.last.direction==='out' ? 'You: ' : ''}${esc(preview)}</div>
    </div>
  </div>`;
}
// group chats: the Posts chat and one chat per list that was texted
function groupChats(){
  const chats = [];
  const p = state.posts[0];
  if(p) chats.push({key:'posts', name:'Posts', icon:'dispatch', at:p.created_at, body:p.body});
  const lastByList = {};
  for(const m of state.messages) if(m.list_key && (!lastByList[m.list_key] || m.created_at > lastByList[m.list_key].created_at)) lastByList[m.list_key] = m;
  for(const [id, m] of Object.entries(lastByList)) if(listName(id)) chats.push({key:'list:'+id, name:listName(id), icon:'client', at:m.created_at, body:m.body});
  return chats;
}
function groupRow(g){
  return `<div class="conv-row ${state.msgPhone===g.key?'active':''}" data-action="open-thread" data-phone="${g.key}">
    <div class="conv-avatar group">${icon(g.icon)}</div>
    <div class="conv-main">
      <div class="conv-top"><b>${esc(g.name)}</b><span class="conv-time">${fmtMsgTime(g.at)}${icon('chev')}</span></div>
      <div class="conv-snip">${esc(g.body.split('\n').filter(l=>l.trim()).join(' '))}</div>
    </div>
  </div>`;
}
function contactRow(p){
  return `<div class="conv-row" data-action="open-thread" data-phone="${p.phone}">${avatarFor(p)}
    <div class="conv-main"><b>${esc(p.name)}</b><div class="conv-snip">${kindLabel(p.kind)} · ${esc(fmtPhone(p.phone))}</div></div></div>`;
}
function inboxView(){
  const q = state.msgSearch.trim().toLowerCase(), digits = q.replace(/\D/g,'');
  const match = (name, phone) => !q || (name||'').toLowerCase().includes(q) || (digits.length>=3 && (phone||'').includes(digits));
  // everything in one list, newest activity first, like a phone's Messages app
  const rows = [
    ...groupChats().filter(g=>match(g.name)).map(g=>({at:g.at, html:groupRow(g)})),
    ...conversations().filter(c=>match(c.who?.name, c.phone)).map(c=>({at:c.last.created_at, html:convRow(c)})),
  ].sort((a,b)=> new Date(b.at) - new Date(a.at)).map(r=>r.html).join('');
  // while searching, people you haven't texted yet show up too
  const talked = new Set(conversations().map(c=>c.phone));
  const others = q ? everyone().filter(p=>!talked.has(p.phone) && match(p.name, p.phone)).sort((a,b)=>a.name.localeCompare(b.name)).slice(0, 20) : [];
  const thread = state.msgPhone==='new' ? newThreadView() : state.msgPhone==='posts' ? postsThread() : state.msgPhone?.startsWith('list:') ? listThreadView(state.msgPhone.slice(5)) : state.msgPhone ? threadView(state.msgPhone) : '';
  return `<div class="inbox ${state.msgPhone ? 'has-thread' : ''}">
    <div class="conv-list">
      <div class="toolbar"><div class="search-box">${icon('search')}<input placeholder="Search" value="${esc(state.msgSearch)}" data-live="msgSearch"></div>
        <button class="icon-btn compose-btn" data-action="open-thread" data-phone="new" title="New message" aria-label="New message">${ICON_EDIT}</button></div>
      ${rows ? `<div class="conv-list-box">${rows}</div>` : !others.length ? `<div class="empty">${icon('chat')}<div>${q ? 'No results' : 'No messages'}</div></div>` : ''}
      ${others.length ? `<div class="date-group-label">Contacts</div><div class="conv-list-box">${others.map(contactRow).join('')}</div>` : ''}
    </div>
    ${thread || `<div class="thread thread-empty"><div class="empty">${icon('chat')}</div></div>`}
  </div>`;
}
// message bubbles: a time in the middle when time has passed; a run of messages from the same side sits close together
function renderBubbles(items, meta){
  let prev = null;
  return items.map((m, i)=>{
    const t = new Date(m.created_at).getTime(), next = items[i+1];
    const sep = !prev || t - new Date(prev.created_at).getTime() > 30*60000 ? `<div class="time-sep">${fmtMsgTime(m.created_at, true)}</div>` : '';
    const lastOfRun = !next || next.direction !== m.direction || new Date(next.created_at).getTime() - t > 30*60000 || (meta(next) !== meta(m));
    prev = m;
    return `${sep}<div class="bubble ${m.direction} ${lastOfRun ? 'tail' : ''}"><div class="btext">${linkify(m.body)}</div>
      ${lastOfRun && meta(m) ? `<div class="bmeta">${meta(m)}</div>` : ''}</div>`;
  }).join('');
}
function statusWord(m){ return m.status==='test' ? ' · Test' : m.status==='not_sent' ? ' · <span class="ns">Not sent</span>' : m.status==='failed' ? ' · <span class="ns">Failed</span>' : m.status==='delivered' ? ' · Delivered' : ''; }
function outMeta(m){
  if(m.direction!=='out') return '';
  const what = m.post_id ? 'Post · ' : m.list_key ? `To ${esc(listName(m.list_key) || 'a list')} · ` : '';
  return what + esc(profileName(m.sent_by) || 'Automatic') + statusWord(m);
}
function composer(key){
  const text = state.msgCompose[key] || '';
  return `<div class="compose"><textarea id="msg-compose" rows="${Math.min(5, Math.max(1, text.split('\n').length))}" placeholder="Text Message">${esc(text)}</textarea>
    <button class="send-btn" data-action="send-thread" data-phone="${key}" aria-label="Send" ${text.trim() ? '' : 'disabled'}>${icon('send')}</button></div>`;
}
function threadHead(avatar, title, sub, right){
  return `<div class="thread-head">
    <button class="icon-btn thread-back" data-action="close-thread" aria-label="Back">${icon('back')}</button>
    ${avatar}<div class="conv-main"><b>${title}</b>${sub ? `<div class="sub">${sub}</div>` : ''}</div>${right||''}
  </div>`;
}
function threadView(phone){
  const who = whoIs(phone);
  const msgs = state.messages.filter(m=>m.phone===phone).sort((a,b)=> new Date(a.created_at) - new Date(b.created_at));
  const name = !who ? esc(fmtPhone(phone)) : who.kind==='contact' ? esc(who.name) : `<span class="name-link" data-nav="${who.kind}" data-id="${who.id}">${esc(who.name)}</span>`;
  return `<div class="thread full">
    ${threadHead(avatarFor(who), name, `${who ? kindLabel(who.kind)+' · ' : ''}${esc(fmtPhone(phone))}`, `<a class="icon-btn call-btn" href="tel:${phone}" aria-label="Call">${icon('phone')}</a>`)}
    <div class="bubbles">${renderBubbles(msgs, outMeta)}</div>
    ${composer(phone)}
    ${testMode() ? `<div class="test-reply"><label>Test reply from ${esc(who?.name || fmtPhone(phone))}</label>
      <div class="compose"><textarea id="test-reply" rows="1">${esc(state.testReply||'')}</textarea>
      <button class="btn btn-outline btn-sm btn-auto" data-action="test-reply" data-phone="${phone}">Receive</button></div></div>` : ''}
  </div>`;
}
// a text to a whole list: each send shows once, with how many people got it
function listThreadView(id){
  const people = listPeople(id), seen = new Map();
  for(const m of state.messages.filter(m=>m.list_key===id)){
    const k = m.body + '|' + m.created_at.slice(0,19);
    if(seen.has(k)) seen.get(k).count++; else seen.set(k, {...m, count:1});
  }
  const sends = [...seen.values()].sort((a,b)=> new Date(a.created_at) - new Date(b.created_at));
  return `<div class="thread full">
    ${threadHead(`<div class="conv-avatar group">${icon('client')}</div>`, esc(listName(id)), `${people.length} ${people.length===1 ? 'person' : 'people'}`)}
    <div class="bubbles">${renderBubbles(sends, m=>`${m.count} ${m.count===1 ? 'person' : 'people'} · ${esc(profileName(m.sent_by) || '')}${statusWord(m)}`)}</div>
    ${composer('list:'+id)}
  </div>`;
}
function postsThread(){
  const posts = state.posts.slice().sort((a,b)=> new Date(a.created_at) - new Date(b.created_at)).map(p=>({...p, direction:'out'}));
  const calls = callsToPost(), fresh = calls.filter(c=>!postNumber(c.r, c.leg)).length;
  return `<div class="thread full">
    ${threadHead(`<div class="conv-avatar group">${icon('dispatch')}</div>`, 'Posts', `${posts.length} sent`)}
    <div class="bubbles">${renderBubbles(posts, p=>`${p.kind==='repost' ? 'Repost' : 'Post'} · ${p.recipients} ${p.recipients===1 ? 'person' : 'people'}${profileName(p.created_by) ? ' · ' + esc(profileName(p.created_by)) : ''}`)}</div>
    <div class="compose post-actions">
      <button class="btn btn-primary btn-sm" data-action="open-post" data-kind="new" ${fresh?'':'disabled'}>${icon('plus')} Post new${fresh ? ` · ${fresh}` : ''}</button>
      <button class="btn btn-outline btn-sm" data-action="open-post" data-kind="repost" ${calls.length?'':'disabled'}>${icon('repeat')} Repost open${calls.length ? ` · ${calls.length}` : ''}</button>
    </div>
  </div>`;
}
// New message: type a name or number in "To:", tap who it is, and their conversation opens
function newThreadView(){
  const q = (state.pickerSearch.to||'').trim(), digits = q.replace(/\D/g,'');
  let list = '';
  if(q){
    const lists = allLists().filter(l=>l.name.toLowerCase().includes(q.toLowerCase()) && listPeople(l.id).length);
    const ppl = peopleMatches(q, ()=>false);
    list = [...lists.map(l=>`<div class="conv-row" data-action="open-thread" data-phone="list:${l.id}"><div class="conv-avatar group">${icon('client')}</div>
        <div class="conv-main"><b>${esc(l.name)}</b><div class="conv-snip">List · ${listPeople(l.id).length} people</div></div></div>`),
      ...ppl.map(contactRow),
      ...(normPhone(digits).length===10 && !ppl.some(p=>p.phone===normPhone(digits)) ? [`<div class="conv-row" data-action="open-thread" data-phone="${normPhone(digits)}">${avatarFor(null)}<div class="conv-main"><b>${esc(fmtPhone(digits))}</b></div></div>`] : []),
    ].join('');
  } else {
    // nothing typed yet: recent conversations first
    list = conversations().slice(0, 12).map(c=>contactRow({...(c.who || {kind:'phone', name: fmtPhone(c.phone)}), phone: c.phone})).join('');
  }
  return `<div class="thread full">
    ${threadHead('', 'New Message', '')}
    <div class="to-row"><span>To:</span><input id="to-input" autocomplete="off" autocorrect="off" value="${esc(state.pickerSearch.to||'')}" data-live="pickerSearch.to"></div>
    <div class="bubbles to-results">${list ? `<div class="conv-list-box">${list}</div>` : `<div class="empty">No match</div>`}</div>
  </div>`;
}
function offerRow(o, withCall){
  const r = byId(state.requests, o.request_id), who = whoIs(o.phone), n = r && postNumber(r, o.leg);
  const isDriver = (o.driver_id && byId(state.drivers, o.driver_id)) || state.drivers.some(d=>normPhone(d.phone)===o.phone);

function perDayDraft(t){

  for(const [day, dp] of Object.entries(t.day_people)) for(const [f] of RECURRING_PEOPLE) if(dp[f]) out[`${f}__${day}`] = dp[f];
  return out;
}

/* ============================= Event delegation ============================= */
let initialized = false;
function initEvents(){
  if(initialized) return; initialized = true;
  document.addEventListener('click', async (e)=>{
    if(e.target.closest('.modal-overlay') && !e.target.closest('.modal') && e.target.closest('[data-action="overlay-click"]')){
      closeModal(); return;
    }
    // tapping anywhere but an address suggestion closes the suggestion list
    closeAddrSuggestions(e.target.closest('.addr-sugg') ? e.target.closest('[data-addr-key]')?.getAttribute('data-addr-key') : null);
    if(e.target.closest('a[href]')) return; // phone and map links do their own thing
    const navEl = e.target.closest('[data-nav]');
    const actionEl = e.target.closest('[data-action]');

    // A nav element wins when it is nested inside the action element (e.g. menu items inside the menu overlay)
    if(navEl && (!actionEl || actionEl.contains(navEl))){
      const r = navEl.getAttribute('data-nav');
      if(navEl.classList.contains('nav-item')) state.navStack = [];
      else if(['client','volunteer','driver'].includes(r)) state.navStack.push({route: state.route, routeId: state.routeId});
      state.route = r; state.routeId = navEl.getAttribute('data-id')||null; state.menuOpen=false; state.modal=null; state.draft={}; state.modalStack=[];
      render(); window.scrollTo(0,0); return;
    }
    if(!actionEl) return;
    const action = actionEl.getAttribute('data-action');

    switch(action){
      case 'toggle-menu': state.menuOpen = !state.menuOpen; render(); break;
      case 'close-menu': if(e.target===actionEl) { state.menuOpen=false; render(); } break;
      case 'logout': stopLive(); await sb.auth.signOut(); try{ history.replaceState(null, '', location.pathname); sessionStorage.removeItem('kvisa-view'); }catch(_){} state.session=null; state.profile=null; state.menuOpen=false; state.modal=null; state.draft={}; state.route='dashboard'; state.authMode='login'; state.authError=''; state.authForm={}; state.toast=null; render(); break;
      case 'switch-auth': state.authMode = state.authMode==='login'?'signup':'login'; state.authError=''; state.authInfo=''; render(); break;
      case 'do-login': {
        const email = document.getElementById('auth-email').value.trim();
        const password = document.getElementById('auth-password').value;
        const {error} = await sb.auth.signInWithPassword({email,password});
        if(error){ state.authError = friendlyAuthError(error); state.authInfo=''; render(); } else { state.authInfo=''; state.authForm = {}; await onAuthed(); }
        break;
      }
      case 'do-signup': {
        const email = document.getElementById('auth-email').value.trim();
        const password = document.getElementById('auth-password').value;
        if(!email || password.length < 6){ state.authError = 'Enter your email and a password of at least 6 characters.'; render(); break; }
        const name = (document.getElementById('auth-name')?.value||'').trim();
        if(!name){ state.authError = 'Please enter your name.'; render(); break; }
        const {data, error} = await sb.auth.signUp({email, password, options:{data:{name}}});
        if(error){ state.authError = friendlyAuthError(error); render(); }
        else if(!data.session){ state.authMode='login'; state.authError=''; state.authInfo = 'Account created. Check your email for a confirmation link, then come back and log in.'; render(); }
        else { state.authError=''; state.authForm = {}; await onAuthed(); }
        break;
      }
      case 'open-modal':
        state.modal = {type: actionEl.getAttribute('data-modal'), id: actionEl.getAttribute('data-id'), date: actionEl.getAttribute('data-date')};
        state.draft = {}; state.modalStack = []; state.pickerSearch = {}; state.menuOpen = false;
        if(state.modal.type==='newRequest'){ state.volDays = []; state.volSort = 'rotation'; }
        render(); break;
      case 'close-modal': closeModal(); break;
      case 'msg-tab': state.msgTab = actionEl.getAttribute('data-tab'); render(); break;
      case 'open-thread': {
        const phone = actionEl.getAttribute('data-phone');
        state.route = 'messages'; state.msgTab = 'inbox'; state.msgPhone = phone; state.modal = null; state.menuOpen = false; state.pickerSearch.to = '';
        render();
        if(phone==='new') document.getElementById('to-input')?.focus(); else if(/^\d+$/.test(phone)) await markRead(phone);
        break;
      }
      case 'close-thread': state.msgPhone = null; render(); break;
      case 'send-thread': {
        const key = actionEl.getAttribute('data-phone'), body = (document.getElementById('msg-compose')?.value||'').trim();
        if(!body) break;
        const listId = key.startsWith('list:') ? key.slice(5) : null;
        const rows = listId ? listPeople(listId).map(p=>({phone:p.phone, body, list_key:listId})) : [{phone:key, body}];
        state.msgCompose[key] = ''; render();
        if(!(await sendTexts(rows)).length){ state.msgCompose[key] = body; }
        render(); document.getElementById('msg-compose')?.focus();
        break;
      }
      case 'open-post': {
        const kind = actionEl.getAttribute('data-kind'), calls = callsToPost();
        let next = Math.max(0, ...state.postNumbers.filter(n=>n.day===todayKey()).map(n=>n.number));
        const items = (kind==='new' ? calls.filter(c=>!postNumber(c.r, c.leg)) : calls)
          .map(c=>{ const n = postNumber(c.r, c.leg); return {request_id:c.r.id, leg:c.leg, n: n || ++next, isNew: !n}; })
          .sort((a,b)=>a.n-b.n);
        state.modal = {type:'postPreview', kind, items}; state.draft = {text: postText(items), list:'drivers'}; render(); break;
      }
      case 'send-post': await sendPost(); break;
      case 'test-reply': await testReply(actionEl.getAttribute('data-phone')); break;
      case 'accept-offer': await acceptOffer(actionEl.getAttribute('data-id')); break;
      case 'open-list-form': {
        const id = actionEl.getAttribute('data-id'), l = id && byId(state.lists, id);
        state.modal = {type:'listForm', id: id||null}; state.draft = l ? {name:l.name, members:[...(l.members||[])]} : {name:'', members:[]}; state.pickerSearch = {};
        render(); break;
      }
      case 'list-add-member': state.draft.members.push({kind:actionEl.getAttribute('data-kind'), id:actionEl.getAttribute('data-id')}); state.pickerSearch.list = ''; render(); break;
      case 'list-remove-member': state.draft.members.splice(Number(actionEl.getAttribute('data-i')), 1); render(); break;
      case 'save-list': await saveList(); break;
      case 'delete-list': {
        const id = actionEl.getAttribute('data-id');
        if(confirm('Delete this list?') && await deleteRow('contact_lists', id)){ state.lists = state.lists.filter(l=>String(l.id)!==id); state.modal = null; render(); }
        break;
      }
      case 'open-contact-form': {
        const id = actionEl.getAttribute('data-id'), c = id && byId(state.contacts, id);
        state.modal = {type:'contactForm', id: id||null}; state.draft = c ? {name:c.name, phone:c.phone, note:c.note||''} : {}; render(); break;
      }
      case 'save-contact': await saveContact(); break;
      case 'delete-contact': {
        const id = actionEl.getAttribute('data-id');
        if(confirm('Delete this contact?') && await deleteRow('contacts', id)){ state.contacts = state.contacts.filter(c=>String(c.id)!==id); state.modal = null; render(); }
        break;
      }
      case 'msg-contact-kind': state.msgContactKind = actionEl.getAttribute('data-kind'); render(); break;
      case 'save-postcalls-settings': await updateSettings({post_header: document.getElementById('set-post-header').value, post_footer: document.getElementById('set-post-footer').value}); showToast('Saved'); render(); break;
      case 'toggle-vol-day': {
        const day = Number(actionEl.getAttribute('data-day'));
        state.volDays = state.volDays.includes(day) ? state.volDays.filter(d=>d!==day) : [...state.volDays, day].sort();
        render(); break;
      }
      case 'clear-vol-filters':
        state.volDays = []; state.volSort = 'rotation'; state.draft.volSearch = ''; state.pickerSearch.volunteer_id = '';
        render(); break;
      case 'set-top-period': state.top[actionEl.getAttribute('data-kind')].period = actionEl.getAttribute('data-period'); render(); break;
      case 'go-dispatch': state.route = 'dispatch'; if(actionEl.getAttribute('data-tab')) state.dispatchTab = actionEl.getAttribute('data-tab'); state.navStack = []; render(); window.scrollTo(0,0); break;
      case 'go-back': {
        const prev = state.navStack.pop();
        if(prev){ state.route = prev.route; state.routeId = prev.routeId; }
        else { state.route = state.route + 's'; state.routeId = null; } // e.g. client -> clients
        render(); window.scrollTo(0,0); break;
      }
      case 'toggle-day': {
        const field = actionEl.getAttribute('data-field') || 'available_days';
        const day = Number(actionEl.getAttribute('data-day')); const days = new Set(state.draft[field]||[]);
        days.has(day) ? days.delete(day) : days.add(day);
        state.draft[field] = [...days].sort(); render(); break;
      }
      case 'push-person': {
        // open "Add client/volunteer/driver" on top of the current window; saving comes back here with it selected
        const kind = actionEl.getAttribute('data-kind'); const field = actionEl.getAttribute('data-field');
        const typed = (state.pickerSearch[field]||'').trim();
        state.modalStack.push({modal: state.modal, draft: state.draft, field});
        state.modal = {type: 'add' + kind.charAt(0).toUpperCase() + kind.slice(1)};
        state.draft = {}; state.pendingPrefill = typed && !/^[\d\s()+-]+$/.test(typed) ? {name: typed} : null;
        render(); break;
      }
      case 'pick': {
        const field = actionEl.getAttribute('data-field'); const value = actionEl.getAttribute('data-value');
        state.pickerSearch[field] = '';
        if(state.modal?.type==='assignPerson'){
          if(state.modal.date){ const m = state.modal; state.modal = state.modalStack.pop()?.modal || null; state.modalStack = []; await setOverride(m.id, m.date, {[field]: value}); }
          else state.modal.recurring ? await assignToRecurring(state.modal.id, field, value, state.modal.dayKey) : await assignToRequest(state.modal.id, field, value);
        }
        else { state.draft[field] = value; render(); }
        break;
      }
      case 'unpick': { const f = actionEl.getAttribute('data-field'); state.draft[f] = null; state.pickerSearch[f] = ''; const [base, sfx] = f.split('__'); const show = {volunteer_id:'_showVol', pickup_driver_id:'_showPd', return_driver_id:'_showRd'}[base]; if(show) state.draft[show + (sfx ? '__' + sfx : '')] = '1'; render(); break; }
      case 'clear-field': state.draft[actionEl.getAttribute('data-field')] = null; render(); break;
      case 'assign-person': {
        if(actionEl.getAttribute('data-occurrence')){
          // choosing someone for one date only
          const t = byId(state.recurring, Number(actionEl.getAttribute('data-id')));
          state.modalStack = [{modal: state.modal, draft: state.draft, field: actionEl.getAttribute('data-field')}];
          state.modal = {type:'assignPerson', id:t.id, field: actionEl.getAttribute('data-field'), recurring:true, date: actionEl.getAttribute('data-date')};
          state.pickerSearch = {}; state.draft = {};
          state.volDays = []; state.volSort = 'rotation';
          render(); break;
        }
        const isRec = !!actionEl.getAttribute('data-recurring');
        const r = byId(isRec ? state.recurring : state.requests, Number(actionEl.getAttribute('data-id')));
        const dayKey = actionEl.getAttribute('data-day');
        state.modal = {type:'assignPerson', id:r.id, field: actionEl.getAttribute('data-field'), recurring: isRec, dayKey};
        state.modalStack = []; state.pickerSearch = {}; state.draft = {};
        state.volDays = []; state.volSort = 'rotation';
        render(); break;
      }
      case 'advance': {
        const id = Number(actionEl.getAttribute('data-id')); const to = actionEl.getAttribute('data-to');
        const saved = await updateRequest(id, {status: to});
        if(saved){ followTab(to); showToast(`#${id} moved to ${TAB_LABELS[to]||STATUS_LABELS[to]}`); }
        break;
      }
      case 'unassign': {
        const id = Number(actionEl.getAttribute('data-id')), field = actionEl.getAttribute('data-field');
        const r = byId(state.requests, id);
        const who = {volunteer_id:'volunteer', volunteer2_id:'second volunteer', pickup_driver_id:'pickup driver', return_driver_id:'return driver'}[field];
        if(!confirm(`Remove the ${who} from #${id}?`)) break;
        const patch = {[field]: null};
        // the second volunteer moves up when the first is removed
        if(field==='volunteer_id' && r.volunteer2_id){ patch.volunteer_id = r.volunteer2_id; patch.volunteer2_id = null; }
        // without its person, a step goes back to waiting for one
        else if(field==='volunteer_id' && r.status==='assigned') patch.status = 'open';
        const saved = await updateRequest(id, patch);
        if(saved){ followTab(saved.status); showToast(`Removed the ${who}`); }
        break;
      }
      case 'delete-person': {
        const kind = actionEl.getAttribute('data-kind'), id = actionEl.getAttribute('data-id');
        const list = state[kind+'s'], p = byId(list, id);
        const used = kind==='driver' ? state.requests.filter(r=>r.pickup_driver_id===id || r.return_driver_id===id).length
                                     : state.requests.filter(r=>r[kind+'_id']===id).length;
        const recurring = kind==='client' ? state.recurring.filter(t=>t.client_id===id).length : 0;
        if(!confirm(`Delete ${p.name}? This cannot be undone.`
          + (used ? `\n\n${used} request(s) will stay, without this ${kind}.` : '')
          + (recurring ? `\nTheir ${recurring} recurring request(s) will be deleted too.` : ''))) break;
        if(!await deleteRow(kind+'s', id)) break;
        state[kind+'s'] = list.filter(x=>x.id!==id);
        // mirror what the database did
        const fields = kind==='driver' ? ['pickup_driver_id','return_driver_id'] : [kind+'_id'];
        state.requests.forEach(r=>fields.forEach(f=>{ if(r[f]===id) r[f]=null; }));
        if(kind==='client') state.recurring = state.recurring.filter(t=>t.client_id!==id);
        else state.recurring.forEach(t=>fields.forEach(f=>{ if(t[f]===id) t[f]=null; }));
        state.route = kind+'s'; state.routeId = null; state.navStack = [];
        showToast(`${p.name} deleted`); break;
      }
      case 'unassign-recurring': {
        const id = Number(actionEl.getAttribute('data-id')), field = actionEl.getAttribute('data-field');
        if(!confirm('Remove this person from the recurring request?')) break;
        const dayKey = actionEl.getAttribute('data-day'), t = byId(state.recurring, id);
        const patch = dayKey != null ? {day_people: {...t.day_people, [dayKey]: {...(t.day_people[dayKey]||{}), [field]: null}}} : {[field]: null};
        if(await updateRecurring(id, patch)) showToast('Removed');
        break;
      }
      case 'toggle-recurring-active': {
        const t = byId(state.recurring, Number(actionEl.getAttribute('data-id')));
        if(await updateRecurring(t.id, {active: !t.active})) showToast(t.active ? 'Paused' : 'Resumed');
        break;
      }
      case 'delete-recurring': {
        const id = Number(actionEl.getAttribute('data-id'));
        if(!confirm('Delete this recurring request? Requests it already created stay in Dispatch.')) break;
        const {error} = await sb.from('recurring_requests').delete().eq('id', id);
        if(error){ showToast(error.message); break; }
        state.recurring = state.recurring.filter(t=>t.id!==id);
        state.requests.forEach(r=>{ if(r.recurring_id===id) r.recurring_id = null; });
        showToast('Deleted'); break;
      }
      case 'save-recurring': await saveRecurring(); break;
      case 'set-repeat':
        state.draft.repeat = actionEl.getAttribute('data-repeat');
        if(state.draft.repeat==='weekly') state.draft.interval_weeks = Number(actionEl.getAttribute('data-n'));
        render(); break;
      case 'occurrence-set': await setOverride(Number(actionEl.getAttribute('data-id')), actionEl.getAttribute('data-date'), {[actionEl.getAttribute('data-field')]: actionEl.getAttribute('data-value') || null}); break;
      case 'occurrence-reset': await setOverride(Number(actionEl.getAttribute('data-id')), actionEl.getAttribute('data-date'), {}, actionEl.getAttribute('data-field')); break;
      case 'occurrence-skip': {
        const id = Number(actionEl.getAttribute('data-id')), date = actionEl.getAttribute('data-date');
        const ov = state.overrides.find(o=>o.recurring_id===id && o.run_date===date);
        await setOverride(id, date, {}, null, !(ov?.skip)); break;
      }
      case 'go-request': {
        const r = byId(state.requests, Number(actionEl.getAttribute('data-id')));
        state.route = 'dispatch'; state.dispatchTab = r.status; state.dispatchSearch = String(r.id); state.navStack = [];
        render(); window.scrollTo(0,0); break;
      }
      case 'toggle-expand': { const id = actionEl.getAttribute('data-id'); state.expanded[id] = !state.expanded[id]; render(); break; }
      case 'save-my-name': {
        const name = document.getElementById('my-name').value.trim();
        if(!name){ showToast('Type your name'); break; }
        const {error} = await sb.rpc('set_my_name', {new_name: name});
        if(error){ showToast(error.message); break; }
        state.profile.name = name; const me = byId(state.profiles, state.profile.id); if(me) me.name = name;
        state.draft._editing = ''; showToast('Saved'); break;
      }
      case 'dispatch-tab': state.dispatchTab = actionEl.getAttribute('data-tab'); render(); break;
      case 'toggle-filter-panel': { const l = actionEl.getAttribute('data-list'); state.filterOpen[l] = !state.filterOpen[l]; render(); break; }
      case 'toggle-filter': {
        const l = actionEl.getAttribute('data-list'), k = actionEl.getAttribute('data-key'); let v = actionEl.getAttribute('data-value');
        if(k==='days') v = Number(v);
        const cur = state.filters[l][k] || [];
        state.filters[l][k] = cur.includes(v) ? cur.filter(x=>x!==v) : [...cur, v];
        render(); break;
      }
      case 'clear-filters': { const l = actionEl.getAttribute('data-list'); state.filters[l] = {...defaultFilters(l), days: []}; render(); break; }
      case 'toggle-settings': { const k=actionEl.getAttribute('data-key'); state.settingsExpanded[k]=!state.settingsExpanded[k]; render(); break; }
      case 'toggle-mashilach': {
        state.draft.is_mashilach = !state.draft.is_mashilach;
        if(state.draft.is_mashilach){
          state.draft.address = state.settings.mashilach_address||state.draft.address; state.draft.note = state.settings.mashilach_note||state.draft.note;
          state.draft._addr = newAddrHolder(state.draft.address);
        }
        render(); break;
      }
      case 'toggle-chip': { const f=actionEl.getAttribute('data-field'); state.draft[f]=!state.draft[f]; render(); break; }
      case 'set-draft': { const f=actionEl.getAttribute('data-field'); state.draft[f]=actionEl.getAttribute('data-value'); render(); break; }
      case 'save-person': await savePerson(actionEl.getAttribute('data-kind'), actionEl.getAttribute('data-id')||null); break;
      case 'save-new-request': await saveNewRequest(); break;
      case 'save-edit-request': await saveEditRequest(Number(actionEl.getAttribute('data-id'))); break;
      case 'delete-request': if(confirm('Delete this request? This cannot be undone.')){ await deleteRequest(Number(actionEl.getAttribute('data-id'))); render(); } break;
      case 'status-menu': state.modal = {type:'statusMenu', id:Number(actionEl.getAttribute('data-id'))}; render(); break;
      case 'set-status': {
        const id = Number(actionEl.getAttribute('data-id')); const status = actionEl.getAttribute('data-status');
        await updateRequest(id, {status}); state.modal=null; followTab(status); render(); break;
      }
      case 'copy-post': {
        const r = byId(state.requests, Number(actionEl.getAttribute('data-id'))); const leg = actionEl.getAttribute('data-leg');
        copyToClipboard(shortLegMessage(r, leg)); break;
      }
      case 'copy-driver': {
        const r = byId(state.requests, Number(actionEl.getAttribute('data-id'))); const leg = actionEl.getAttribute('data-leg');
        copyToClipboard(driverMessage(r, leg)); break;
      }
      case 'pick-address': pickAddress(actionEl.getAttribute('data-key'), Number(actionEl.getAttribute('data-i'))); break;
      case 'use-address-match': useAddressMatch(actionEl.getAttribute('data-key')); break;
      case 'save-mashilach-settings':
        if(!(await confirmAddress('mash'))) break;
        await updateSettings({mashilach_address: composeAddress(state.mashAddr), mashilach_note: document.getElementById('set-mashilach-note').value}); showToast('Saved'); render(); break;
      case 'save-postmsg-settings': await updateSettings({post_message_template: {before:document.getElementById('set-pm-before').value, between:document.getElementById('set-pm-between').value, after:document.getElementById('set-pm-after').value}}); showToast('Saved'); render(); break;
      case 'save-drivermsg-settings': await updateSettings({driver_message_pickup_template: document.getElementById('set-dm-pickup').value, driver_message_return_template: document.getElementById('set-dm-return').value}); showToast('Saved'); render(); break;
      case 'send-invite': {
        const email = (state.inviteEmail||'').trim();
        const role = state.inviteRole || 'dispatcher';
        if(!/^\S+@\S+\.\S+$/.test(email)){ showToast('Enter a valid email'); break; }
        if(await addInvite(email, role)){ state.inviteEmail = ''; state.inviteRole = 'dispatcher'; }
        // right away offer to send them the invitation by email / WhatsApp / text
        if(state.invites.some(i=>i.email===email.toLowerCase())){ state.modal = {type:'sendInvite', email: email.toLowerCase()}; render(); }
        break;
      }
      case 'set-invite-role': state.inviteRole = actionEl.getAttribute('data-role'); render(); break;
      case 'open-send-invite': state.modal = {type:'sendInvite', email: actionEl.getAttribute('data-email')}; render(); break;
      case 'copy-invite': copyToClipboard(inviteMessage(state.modal.email)); break;
      case 'remove-invite': await removeInvite(actionEl.getAttribute('data-email')); render(); break;
      case 'toggle-role': await updateProfileRole(actionEl.getAttribute('data-id'), actionEl.getAttribute('data-role')); render(); break;
      case 'remove-user': if(confirm('Remove this user\'s access?')){ await removeProfile(actionEl.getAttribute('data-id')); render(); } break;
    }
  });

  document.addEventListener('input', (e)=>{
    const liveEl = e.target.closest('[data-live]');
    if(liveEl){
      const path = liveEl.getAttribute('data-live').split('.');
      const last = path.pop(); path.reduce((o,k)=>o[k], state)[last] = liveEl.value;
      // re-render so the list filters while typing, then put the cursor back
      const key = liveEl.getAttribute('data-live'); const pos = liveEl.selectionStart;
      render();
      const again = document.querySelector(`[data-live="${key}"]`);
      if(again){
        again.focus();
        // email inputs don't support setSelectionRange; re-setting the value puts the cursor at the end instead
        try{ again.setSelectionRange(pos,pos); }catch(_){ const v = again.value; again.value = ''; again.value = v; }
      }
      return;
    }
    const addrEl = e.target.closest('[data-addr]');
    if(addrEl){ onAddrInput(addrEl); return; }
    const bindEl = e.target.closest('[data-bind]');
    if(bindEl){ state.draft[bindEl.getAttribute('data-bind')] = bindEl.value; }
    if(e.target.id && e.target.id.startsWith('auth-')) state.authForm[e.target.id] = e.target.value;
    if(e.target.id === 'msg-compose'){
      state.msgCompose[state.msgPhone] = e.target.value;
      e.target.rows = Math.min(5, Math.max(1, e.target.value.split('\n').length));
      const btn = document.querySelector('.send-btn'); if(btn) btn.disabled = !e.target.value.trim();
    }
    if(e.target.id === 'test-reply') state.testReply = e.target.value;
  });
  // on a computer Enter sends and Shift+Enter starts a new line; phones keep Enter for new lines, like messaging apps
  document.addEventListener('keydown', (e)=>{
    if(e.target.id==='msg-compose' && e.key==='Enter' && !e.shiftKey && matchMedia('(hover: hover) and (pointer: fine)').matches){
      e.preventDefault(); document.querySelector('.send-btn')?.click();
    }
  });
  document.addEventListener('change', (e)=>{
    if(e.target.closest('[data-live]')) return;
    const sortEl = e.target.closest('[data-filtersort]');
    if(sortEl){ state.filters[sortEl.getAttribute('data-filtersort')].sort = sortEl.value; render(); return; }
    const topEl = e.target.closest('[data-topdate]');
    if(topEl){ const [kind, k] = topEl.getAttribute('data-topdate').split('.'); state.top[kind][k] = topEl.value; render(); return; }
    const setEl = e.target.closest('[data-setstate]');
    if(setEl){ state[setEl.getAttribute('data-setstate')] = setEl.value; render(); return; }
    const bindEl = e.target.closest('[data-bind]');
    if(bindEl){
      state.draft[bindEl.getAttribute('data-bind')] = bindEl.value;
      // volunteers available on the requested day float to the top of the picker

    }
  });
}

function closeModal(){
  const prev = state.modalStack.pop();
  if(prev){ state.modal = prev.modal; state.draft = prev.draft; }
  else { state.modal = null; state.draft = {}; state.pickerSearch = {}; }
  render();
}

// Filling in the person a step needs moves the request on by itself
function autoStatus(r){
  if(r.status==='open' && r.volunteer_id) return r.pickup_driver_id ? 'posted_pickup' : 'assigned';
  if(r.status==='assigned' && r.pickup_driver_id) return 'posted_pickup';
  if(r.status==='finished' && r.return_driver_id) return 'posted_return';
  return r.status;
}
async function assignToRequest(id, field, value){
  const r = byId(state.requests, id);
  if(field==='volunteer2_id' && value===r.volunteer_id){ showToast('Already the volunteer on this call'); return; }
  const patch = {[field]: value};
  const next = autoStatus({...r, ...patch});
  if(next !== r.status) patch.status = next;
  const saved = await updateRequest(id, patch);
  if(!saved) return;
  state.modal = null; state.draft = {}; state.modalStack = []; state.pickerSearch = {};
  followTab(saved.status);
  showToast(next !== r.status ? `#${id} moved to ${TAB_LABELS[next]||STATUS_LABELS[next]}` : 'Saved');
}

async function updateRecurring(id, patch){
  const d = await updateRow('recurring_requests', id, patch);
  if(d){ const i = state.recurring.findIndex(x=>x.id===id); state.recurring[i] = d; render(); }
  return d;
}
// save a one-time change (or skip) for one date of a recurring request
async function setOverride(id, date, changes, resetField, skip){
  const cur = state.overrides.find(o=>o.recurring_id===id && o.run_date===date);
  const merged = {...(cur?.changes||{}), ...changes};
  if(resetField) delete merged[resetField];
  const row = {recurring_id:id, run_date:date, changes: merged, skip: skip ?? (cur?.skip || false)};
  const {data, error} = await sb.from('recurring_overrides').upsert(row).select().single();
  if(error){ showToast(error.message); return; }
  state.overrides = state.overrides.filter(o=>!(o.recurring_id===id && o.run_date===date)).concat(data);
  showToast(skip===true ? 'This date is skipped' : skip===false ? 'This date is back on' : 'Saved for this date only');
}
async function assignToRecurring(id, field, value, dayKey){
  const t = byId(state.recurring, id);
  const patch = dayKey != null
    ? {day_people: {...(t.day_people||{}), [dayKey]: {...((t.day_people||{})[dayKey]||{}), [field]: value}}}
    : {[field]: value};
  const saved = await updateRecurring(id, patch);
  if(!saved) return;
  state.modal = null; state.draft = {}; state.modalStack = []; state.pickerSearch = {};
  showToast('Saved — new requests will include this');
}
async function saveRecurring(){
  const d = state.draft;
  if(!d.client_id){ showToast('Select a client'); return; }
  if(!(d.days||[]).length){ showToast('Choose at least one day'); return; }
  if(d.repeat==='monthly' && !(d.month_weeks||[]).length){ showToast('Choose which week of the month'); return; }
  const perDay = d._perDay && d.days.length > 1;
  const day_people = {};
  if(perDay) for(const day of d.days){ day_people[day] = {}; for(const [f] of RECURRING_PEOPLE) day_people[day][f] = d[`${f}__${day}`] || null; }
  const payload = {
    client_id: d.client_id, days: d.days, time_of_day: d.time_of_day || '10:00', bags: Number(d.bags)||1,
    // with different people per day, the usual people are left empty
    volunteer_id: perDay ? null : d.volunteer_id||null, pickup_driver_id: perDay ? null : d.pickup_driver_id||null, return_driver_id: perDay ? null : d.return_driver_id||null,
    day_people,
    notes: (d.notes||'').trim() || null,
    repeat: d.repeat || 'weekly', interval_weeks: Number(d.interval_weeks)||1, month_weeks: d.month_weeks || [],
    start_date: d.start_date || ymd(new Date()),
  };
  const id = state.modal.id ? Number(state.modal.id) : null;
  let saved;
  if(id) saved = await updateRecurring(id, payload);
  else { saved = await createRow('recurring_requests', payload); if(saved) state.recurring.push(saved); }
  if(!saved) return;
  // if it's due today (and it's past 7 AM), put it in Dispatch right away
  try{ const {data} = await sb.rpc('generate_recurring_requests'); if(data){ const r = await sb.from('requests').select('*').order('id',{ascending:false}); if(r.data) state.requests = r.data; } }catch(_){}
  state.modal = null; state.draft = {}; render();
  showToast('Saved');
}
async function saveNewRequest(){
  const d = state.draft;
  if(!d.client_id){ showToast('Select a client'); return; }
  const payload = {
    client_id: d.client_id, bags: Number(d.bags)||1,
    requested_for: d.requested_for ? new Date(d.requested_for).toISOString() : null,
    volunteer_id: d.volunteer_id || null, notes: d.notes||'', status: d.volunteer_id ? 'assigned' : 'open'
  };
  const saved = await createRequest(payload);
  if(!saved) return;
  state.modal = null; state.draft = {}; state.route = 'dispatch'; followTab(saved.status); render();
}
async function saveEditRequest(id){
  const d = state.draft;
  const r = byId(state.requests, id);
  const patch = {
    client_id: d.client_id||null, bags: Number(d.bags)||1, volunteer_id: d.volunteer_id||null,
    pickup_driver_id: d.pickup_driver_id||null, return_driver_id: d.return_driver_id||null,
    requested_for: d.requested_for ? new Date(d.requested_for).toISOString() : null,
    notes: d.notes||''
  };
  patch.status = autoStatus({...r, ...patch});
  const saved = await updateRequest(id, patch);
  if(!saved) return;
  followTab(saved.status);
  state.modal = null; state.draft = {}; render();
}
async function savePerson(kind, id){
  const COLS = {
    client: ['name','phone','address','note','private_note','is_mashilach','status'],
    volunteer: ['name','phone','address','note','private_note','status','temp_inactive_from','temp_inactive_until','bag_capacity','wash_frequency','available_days'],
    driver: ['name','phone','email','address','private_note','contact_sms','contact_whatsapp','status'],
  }[kind];
  const d = {};
  for(const k of COLS){ if(k in state.draft){ const val = state.draft[k]; d[k] = (typeof val==='string' && val.trim()==='') ? null : (typeof val==='string' ? val.trim() : val); } }
  if(!d.name){ showToast('Name is required'); return; }
  if(!(await confirmAddress('draft'))) return;
  if(kind==='volunteer' && d.status!=='temporary_inactive'){ d.temp_inactive_from = null; d.temp_inactive_until = null; }
  if(kind==='volunteer' && d.status==='temporary_inactive' && !d.temp_inactive_until){ showToast('Pick the "Until" date'); return; }
  let saved = null;
  if(kind==='client'){ saved = id ? await updateClient(id, d) : await createClient(d); }
  if(kind==='volunteer'){ saved = id ? await updateVolunteer(id, d) : await createVolunteer(d); }
  if(kind==='driver'){ saved = id ? await updateDriver(id, d) : await createDriver(d); }
  if(!saved) return; // keep the form open so nothing typed is lost
  const prev = state.modalStack.pop();
  if(prev){
    // came here from a request: go back to it with the new person already chosen
    if(prev.modal.type==='assignPerson' && prev.modal.date){
      const m = prev.modal; state.modal = state.modalStack.pop()?.modal || null; state.modalStack = []; state.draft = {};
      await setOverride(m.id, m.date, {[prev.field]: saved.id}); return;
    }
    if(prev.modal.type==='assignPerson'){ prev.modal.recurring ? await assignToRecurring(prev.modal.id, prev.field, saved.id, prev.modal.dayKey) : await assignToRequest(prev.modal.id, prev.field, saved.id); return; }
    state.modal = prev.modal; state.draft = {...prev.draft, [prev.field]: saved.id};
    state.pickerSearch[prev.field] = ''; render(); return;
  }
  state.modal = null; state.draft = {}; render();
}

/* ============================= Auth bootstrap ============================= */
async function onAuthed(){
  const {data:{session}} = await sb.auth.getSession();
  state.session = session;
  if(session){
    const {data:profile} = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
    state.profile = profile;
    if(!profile){ state.loading = false; render(); return; }
    restoreLocation();
    state.loading = true; render();
    await loadAll();
  } else {
    render();
  }
}

sb.auth.onAuthStateChange((event, session)=>{
  state.session = session;
  if(!session){ state.profile=null; state.loading=true; render(); }
});

initEvents();
onAuthed();
</script>
