<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Nekius Dispatch</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  --blue:#1565c0; --blue-dark:#0d47a1; --blue-light:#e3f0fd;
  --green:#2e8b57; --amber:#e0a500; --gray:#9aa1a9; --red:#c0392b;
  --bg:#f3f5f7; --card:#ffffff; --text:#202124; --muted:#6b7280; --border:#e1e4e8;
}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);}
#app{min-height:100vh;display:flex;flex-direction:column;}
a{color:var(--blue);}
.header{background:linear-gradient(90deg,var(--blue),var(--blue-dark));color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50;}
.header .title{font-size:20px;font-weight:700;flex:1;}
.icon-btn{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;padding:6px;}
.avatar{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;}
.main{flex:1;padding:16px;max-width:720px;margin:0 auto;width:100%;padding-bottom:70px;}
.footer{text-align:center;color:var(--muted);font-size:11px;padding:16px;background:#eceff1;}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:14px;font-weight:700;font-size:15px;cursor:pointer;border:1px solid transparent;width:100%;letter-spacing:.3px;}
.btn-primary{background:var(--blue);color:#fff;}
.btn-outline{background:#fff;color:var(--blue);border-color:var(--blue);}
.btn-danger{background:#fff;color:var(--red);border-color:var(--red);}
.btn-sm{padding:8px 12px;font-size:13px;width:auto;}
.btn-row{display:flex;gap:10px;}
.btn-row .btn{flex:1;}

.card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);border-left:4px solid transparent;}
.card.status-open{border-left-color:#9aa1a9;}
.card.status-assigned{border-left-color:#1565c0;}
.card.status-posted_pickup,.card.status-posted_return{border-left-color:#8e44ad;}
.card.status-delivered{border-left-color:#00897b;}
.card.status-finished{border-left-color:#f39c12;}
.card.status-completed{border-left-color:#2e8b57;}
.card.status-not_covered{border-left-color:#c0392b;}
.card.status-cancelled{border-left-color:#555;}

.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700;color:#fff;cursor:pointer;}
.badge.status-open{background:#9aa1a9;}
.badge.status-assigned{background:#1565c0;}
.badge.status-posted_pickup,.badge.status-posted_return{background:#8e44ad;}
.badge.status-delivered{background:#00897b;}
.badge.status-finished{background:#f39c12;}
.badge.status-completed{background:#2e8b57;}
.badge.status-not_covered{background:#c0392b;}
.badge.status-cancelled{background:#555;}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;}
.dot.green{background:var(--green);} .dot.amber{background:var(--amber);} .dot.gray{background:var(--gray);}

input,select,textarea{width:100%;padding:12px;border:1px solid var(--border);border-radius:8px;font-size:15px;background:#fff;color:var(--text);font-family:inherit;}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px;font-weight:600;}
.field{margin-bottom:6px;}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;}
.chip{padding:8px 14px;border-radius:999px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:13px;font-weight:600;}
.chip.active{background:var(--blue);color:#fff;border-color:var(--blue);}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:10px 0;}
.switch{position:relative;width:46px;height:26px;border-radius:13px;background:var(--border);cursor:pointer;flex-shrink:0;}
.switch.on{background:var(--blue);}
.switch .knob{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;}
.switch.on .knob{left:23px;}

.tabs{display:flex;overflow-x:auto;gap:18px;border-bottom:1px solid var(--border);margin-bottom:14px;-webkit-overflow-scrolling:touch;}
.tab{padding:10px 2px;white-space:nowrap;color:var(--muted);font-weight:700;font-size:14px;border-bottom:3px solid transparent;cursor:pointer;display:flex;align-items:center;gap:6px;}
.tab.active{color:var(--blue);border-bottom-color:var(--blue);}
.tab .count{background:var(--blue-light);color:var(--blue);border-radius:999px;padding:1px 8px;font-size:12px;}
.tab.active .count{background:var(--blue);color:#fff;}

.list-item{display:flex;justify-content:space-between;align-items:center;padding:14px;background:#fff;border-radius:10px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.06);}
.list-item .name{font-weight:700;}
.list-item .sub{font-size:13px;color:var(--muted);}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:100;}
.modal{background:#fff;border-radius:16px 16px 0 0;padding:20px;width:100%;max-width:720px;max-height:92vh;overflow-y:auto;}
@media(min-width:760px){.modal-overlay{align-items:center;} .modal{border-radius:16px;}}
.modal h2{margin-top:0;}
.modal-close{float:right;background:none;border:none;font-size:22px;cursor:pointer;color:var(--muted);}

.section-title{font-size:22px;font-weight:800;margin:4px 0 14px;}
.step-num{width:28px;height:28px;border-radius:50%;background:var(--border);color:#555;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;margin-right:10px;flex-shrink:0;}
.step-head{display:flex;align-items:flex-start;gap:0;margin-bottom:8px;}
.step-head .step-text b{display:block;font-size:17px;}
.step-head .step-text span{font-size:13px;color:var(--muted);}
hr.sep{border:none;border-top:1px solid var(--border);margin:18px 0;}

.accordion-head{display:flex;align-items:center;gap:10px;padding:14px;background:#fff;border-radius:10px;cursor:pointer;font-weight:700;margin-bottom:6px;}
.accordion-body{padding:12px 4px;}

.empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:14px;}
.search-wrap{position:relative;margin-bottom:10px;}
.hamburger-menu{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:flex;}
.hamburger-panel{background:#fff;width:260px;height:100%;padding:16px;}
.hamburger-panel .nav-item{padding:14px 10px;border-radius:8px;cursor:pointer;font-weight:600;display:flex;align-items:center;gap:10px;}
.hamburger-panel .nav-item.active{background:var(--blue-light);color:var(--blue);}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:300;}
.msg-box{background:#f8f9fa;border:1px dashed var(--border);border-radius:8px;padding:10px;font-size:13px;white-space:pre-wrap;margin-top:6px;}
.pill-outline{border:1px solid var(--border);border-radius:999px;padding:6px 12px;font-size:13px;background:#fff;}
.error-text{color:var(--red);font-size:13px;margin-top:6px;}
.row-between{display:flex;justify-content:space-between;align-items:center;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.req-head{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.req-head .by{font-size:12px;color:var(--muted);margin-left:8px;font-weight:400;}
.req-tools{display:flex;align-items:center;gap:4px;}
.icon-only{background:none;border:none;cursor:pointer;padding:6px;border-radius:8px;color:var(--muted);display:inline-flex;}
.icon-only:hover{background:var(--bg);}
.icon-only.danger{color:var(--red);}
.icon-only svg{width:18px;height:18px;}
.req-grid{display:grid;grid-template-columns:max-content 1fr;column-gap:12px;row-gap:6px;margin-top:10px;font-size:14px;align-items:baseline;}
.req-grid .k{color:var(--muted);font-size:13px;}
.req-grid .v{min-width:0;overflow-wrap:anywhere;}
.req-grid .faded{font-size:11px;color:var(--muted);}
.req-grid .faded .name-link{font-weight:500;}
.name-link{color:var(--blue);font-weight:700;cursor:pointer;text-decoration:underline;text-decoration-color:rgba(21,101,192,.3);text-underline-offset:3px;}
.req-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
.req-actions .btn{width:auto;flex:1 1 140px;padding:10px 12px;font-size:13px;}
.req-row{display:flex;align-items:center;gap:10px;background:#fff;border-radius:10px;padding:10px 12px;margin-bottom:6px;box-shadow:0 1px 2px rgba(0,0,0,.06);cursor:pointer;font-size:13px;}
.req-row .row-text{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.req-row .sub{white-space:nowrap;font-size:12px;color:var(--muted);}
.status-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.status-dot.status-completed{background:#2e8b57;} .status-dot.status-not_covered{background:#c0392b;} .status-dot.status-cancelled{background:#555;}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;margin-left:6px;background:#e6f4ea;color:var(--green);}
.tag.gray{background:var(--bg);color:var(--muted);}
.picker-list{border:1px solid var(--border);border-radius:10px;margin-top:6px;max-height:300px;overflow-y:auto;}
.picker-item{padding:11px 12px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;}
.picker-item:last-child{border-bottom:none;}
.picker-item:hover{background:var(--blue-light);}
.picker-add{color:var(--blue);font-weight:700;}
.picked{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;border:1px solid var(--blue);border-radius:10px;background:var(--blue-light);}
.picked a{cursor:pointer;font-weight:700;font-size:13px;}
.sort-row{display:flex;align-items:center;gap:8px;}
.sort-row label{margin:0;white-space:nowrap;}
.sort-row select{padding:8px;}
.private{background:#fff8e1;border-radius:8px;padding:8px 10px;font-size:13px;margin-top:8px;}
.hint{font-size:12px;color:var(--muted);margin-top:2px;}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;}
.stat-grid .card{margin-bottom:0;cursor:pointer;}
.stat .big{font-size:34px;font-weight:800;line-height:1;color:var(--blue);}
.stat .label{font-weight:700;margin-top:6px;}
.stat-lines{margin-top:8px;font-size:13px;color:var(--muted);}
.stat-lines div{display:flex;justify-content:space-between;padding:2px 0;border-top:1px dashed var(--border);}
.stat-lines b{color:var(--text);}
.top-cols{margin-top:6px;gap:18px;}
.top-head{font-weight:700;margin:8px 0 4px;}
.top-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);}
.top-row .name-link{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.top-row .rank{width:20px;height:20px;border-radius:50%;background:var(--blue-light);color:var(--blue);font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
@media(max-width:480px){.top-cols{grid-template-columns:1fr;}}
.avatar{cursor:pointer;border:none;color:#fff;}
.person-sub{font-size:12px;color:var(--muted);}
.person-sub a{color:var(--blue);}
.clear-all{margin-left:auto;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================= Supabase ============================= */
const SUPABASE_URL = 'https://icghbewmvapvrxmwxlyg.supabase.co';
const SUPABASE_KEY = 'sb_publishable__1M7GqXmmDuYI_vPs8hB4g_GRWe6EQG';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ============================= State ============================= */
const state = {
  session: null,
  profile: null,          // {id, email, role}
  route: 'dashboard',     // dashboard | dispatch | clients | volunteers | drivers | history | settings | client | volunteer | driver
  routeId: null,
  menuOpen: false,
  modal: null,            // {type:'newRequest'|'editRequest'|'addClient'|...}
  draft: {},
  dispatchTab: 'open',
  dispatchSearch: '',
  listFilter: 'active',   // active | inactive | all (per list page)
  settingsExpanded: {},
  toast: null,
  authMode: 'login',      // login | signup
  authError: '', authInfo: '',
  clients: [], volunteers: [], drivers: [], requests: [], profiles: [], invites: [],
  settings: { mashilach_address:'', mashilach_note:'', post_message_template:{before:'',between:' to ',after:''},
    driver_message_pickup_template:'Laundry pickup — Request #{request_id}\n\nPick up from: {client_name}\n{client_address}\n{client_note}\nBags: {bags}\nWhen: {requested_for}\n\nDeliver to: {volunteer_name}\n{volunteer_address}\n{volunteer_note}',
    driver_message_return_template:'Laundry return — Request #{request_id}\n\nPick up from: {volunteer_name}\n{volunteer_address}\n{volunteer_note}\n\nDeliver to: {client_name}\n{client_address}\n{client_note}' },
  loading: true,
  modalStack: [],         // modals underneath the current one (e.g. New Request under Add Client)
  pickerSearch: {},       // search text per picker field
  expanded: {},           // finished requests opened from their one-line view
  volSort: 'name', volDays: defaultVolDays(),
  navStack: [],           // where to go back to from a profile page
};

const STATUS_FLOW = ['open','assigned','posted_pickup','delivered','finished','posted_return','completed'];
const STATUS_LABELS = {
  open:'Open', assigned:'Assigned', posted_pickup:'Posted', delivered:'Delivered',
  finished:'Finished', posted_return:'Posted', completed:'Completed',
  not_covered:'Not Covered', cancelled:'Cancelled'
};
const ALL_STATUSES = [...STATUS_FLOW, 'not_covered', 'cancelled'];
// Both legs share the status name "Posted"; tabs and menus say which leg
const TAB_LABELS = { posted_pickup:'Posted · Pickup', posted_return:'Posted · Return' };

function render(){
  // remember which box has the cursor so a re-render (e.g. a toast disappearing) doesn't take it away
  const a = document.activeElement, keys = ['id','data-live','data-bind'];
  const key = a && a.matches && a.matches('input,textarea') ? keys.map(k=>[k, a.getAttribute(k)]).find(([,v])=>v) : null;
  let pos = null; try{ pos = a.selectionStart; }catch(_){}
  const r = routes[state.route] || routes.dashboard;
  document.getElementById('app').innerHTML = layout(r());
  if(key){
    const el = document.querySelector(key[0]==='id' ? '#'+CSS.escape(key[1]) : `[${key[0]}="${key[1]}"]`);
    if(el){
      el.focus();
      const toEnd = () => { const v = el.value; el.value = ''; el.value = v; };
      try{ pos!=null ? el.setSelectionRange(pos,pos) : toEnd(); }catch(_){ toEnd(); }
    }
  }
  afterRender();
}

function afterRender(){
  if(state.route === 'dispatch'){
    requestAnimationFrame(()=>{
      const el = document.querySelector('.tab.active');
      if(el) el.scrollIntoView({behavior:'instant', inline:'center', block:'nearest'});
    });
  }
}

/* ============================= Helpers ============================= */
function toLocalInputValue(d){
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function fmtDateTime(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'});
}
const PERSON_STATUS = { active:'Active', inactive:'Inactive', temporary_inactive:'Temporary Inactive' };
const DAY_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DAY_LONG = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const WORK_DAYS = [0,1,2,3,4,5]; // Sunday–Friday (no Shabbos)
// days to highlight by default: the given date's weekday, or none on Shabbos
function defaultVolDays(date){ const d = (date ? new Date(date) : new Date()).getDay(); return d === 6 ? [] : [d]; }
const WASH_FREQ = { weekly:'Once a week', three_monthly:'Three times a month', twice_monthly:'Twice a month', once_monthly:'Once a month' };
const WASH_DAYS = { weekly:7, three_monthly:10, twice_monthly:15, once_monthly:30 }; // days allowed between completed washes
const DONE = ['completed','not_covered','cancelled'];
function capacityLabel(c){ return c==='4plus' ? "4 bag's plus" : c ? `${c} bag's` : '—'; }
function availableOn(v, day){ return (v.available_days||[]).includes(day); }
function daysLabel(v, only){ return (v.available_days||[]).filter(i=>i<6 && (!only || only.includes(i))).sort().map(i=>DAY_SHORT[i]).join(', '); }
function profileName(id){ const p = byId(state.profiles, id); return p ? (p.name || p.email.split('@')[0]) : ''; }
function fmtShortDate(iso){ return iso ? new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric'}) : ''; }
const ICON_EDIT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
const ICON_TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>';
function initials(name){ if(!name) return '?'; return name.trim().split(/\s+/).slice(0,2).map(s=>s[0]).join('').toUpperCase(); }
function byId(arr,id){ return arr.find(x=>String(x.id)===String(id)); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function streetOnly(address){
  if(!address) return '';
  let a = address.split(',')[0].trim();
  a = a.replace(/^\d+\s+/, ''); // leading house number
  a = a.replace(/\b(street|st|avenue|ave|road|rd|drive|dr|lane|ln|boulevard|blvd|court|ct|place|pl|way|terrace|ter)\.?$/i, '').trim();
  return a || address;
}
function shortLegMessage(req, leg){
  const client = byId(state.clients, req.client_id);
  const vol = byId(state.volunteers, req.volunteer_id);
  const clientSt = streetOnly(client?.address);
  const volSt = streetOnly(vol?.address);
  const t = state.settings.post_message_template || {before:'',between:' to ',after:''};
  const [from,to] = leg === 'return' ? [volSt, clientSt] : [clientSt, volSt];
  return `${t.before||''}${from}${t.between||' to '}${to}${t.after||''}`;
}
function renderTemplate(tmpl, vars){
  const lines = (tmpl||'').split('\n').map(line=>{
    const keys = [...line.matchAll(/\{(\w+)\}/g)].map(m=>m[1]).filter(k=> k in vars);
    // drop a line whose placeholders all came out empty (a missing note, "Bags:" on the return leg)
    if(keys.length && keys.every(k=> vars[k]==null || String(vars[k]).trim()==='')) return null;
    return line.replace(/\{(\w+)\}/g, (m,k)=> k in vars ? vars[k] : m);
  });
  return lines.filter(l=>l!==null).join('\n');
}
function driverMessage(req, leg){
  const client = byId(state.clients, req.client_id);
  const vol = byId(state.volunteers, req.volunteer_id);
  const driver = byId(state.drivers, leg==='return' ? req.return_driver_id : req.pickup_driver_id);
  const tmpl = leg==='return' ? state.settings.driver_message_return_template : state.settings.driver_message_pickup_template;
  return renderTemplate(tmpl, {
    request_id: req.id, driver_name: driver?.name||'',
    client_name: client?.name||'', client_address: client?.address||'', client_phone: client?.phone||'', client_note: client?.note||'',
    volunteer_name: vol?.name||'', volunteer_address: vol?.address||'', volunteer_phone: vol?.phone||'', volunteer_note: vol?.note||'',
    // the washer packages freely on the return leg, so no bag count there
    bags: leg==='return' ? '' : bagsLabel(req.bags), requested_for: fmtDateTime(req.requested_for)
  });
}
// Bag counts are stored as numbers; 4 means "4 or more"
function bagsLabel(n){ if(!n) return '—'; return Number(n)>=4 ? '4+' : String(n); }
function bagChips(){
  return ['1','2','3','4'].map(b=>`<div class="chip ${String(state.draft.bags)===b?'active':''}" data-action="set-draft" data-field="bags" data-value="${b}">${b==='4'?'4+':b}</div>`).join('');
}
function phoneLink(phone){ return phone ? `<a href="tel:${esc(phone.replace(/[^\d+]/g,''))}">${esc(phone)}</a>` : 'No phone'; }
function copyToClipboard(text){
  navigator.clipboard?.writeText(text).then(()=>showToast('Copied to clipboard')).catch(()=>showToast('Could not copy'));
}
function showToast(msg){ state.toast = msg; render(); setTimeout(()=>{ state.toast=null; render(); }, 2200); }

function volunteerReadiness(vol){
  const completedTime = r => new Date(r.completed_at || r.updated_at).getTime();
  const completed = state.requests.filter(r=>r.volunteer_id===vol.id && r.status==='completed')
    .sort((a,b)=> completedTime(b) - completedTime(a));
  if(completed.length===0) return 'gray';
  const last = new Date(completedTime(completed[0]));
  const days = (Date.now() - last.getTime()) / 86400000;
  const threshold = WASH_DAYS[vol.wash_frequency] || 30;
  return days <= threshold ? 'green' : 'amber';
}

function activeFilter(list, key){
  if(state.listFilter === 'all') return list;
  if(state.listFilter === 'inactive') return list.filter(x=> x.status !== 'active');
  return list.filter(x=> x.status === 'active');
}

/* ============================= Supabase data ============================= */
async function loadAll(){
  const [c,v,d,r,s,p,inv] = await Promise.all([
    sb.from('clients').select('*').order('name'),
    sb.from('volunteers').select('*').order('name'),
    sb.from('drivers').select('*').order('name'),
    sb.from('requests').select('*').order('id',{ascending:false}),
    sb.from('app_settings').select('*').eq('id',1).maybeSingle(),
    sb.from('profiles').select('*').order('email'),
    sb.from('invites').select('*').order('created_at'),
  ]);
  const failed = [c,v,d,r,s].find(x=>x.error);
  if(failed) showToast('Could not load data: ' + failed.error.message);
  state.clients = c.data||[]; state.volunteers = v.data||[]; state.drivers = d.data||[];
  state.requests = r.data||[]; state.profiles = p.data||[]; state.invites = inv.data||[];
  if(s.data) state.settings = { ...state.settings, ...s.data };
  state.loading = false;
  render();
  await revertExpiredTempInactive();
}

// Temporary Inactive volunteers go back to Active once their "until" date has passed
async function revertExpiredTempInactive(){
  const today = toLocalInputValue(new Date()).slice(0,10);
  const expired = state.volunteers.filter(v=> v.status==='temporary_inactive' && v.temp_inactive_until && v.temp_inactive_until < today);
  if(!expired.length) return;
  for(const v of expired){ await updateVolunteer(v.id, {status:'active', temp_inactive_from:null, temp_inactive_until:null}); }
  render();
}

function friendlyAuthError(error){
  const m = error?.message || String(error);
  if(/database error saving new user|not_invited|not been invited/i.test(m)) return "This email hasn't been invited yet. Ask your Editor to add it in Settings → Dispatcher access, then try again.";
  if(/invalid login credentials/i.test(m)) return 'Wrong email or password.';
  if(/email not confirmed/i.test(m)) return 'Please confirm your email first — check your inbox for the link.';
  if(/already registered/i.test(m)) return 'This email already has an account. Tap "Log in" below.';
  return m;
}

async function createRow(table, payload){ const {data,error} = await sb.from(table).insert(payload).select().single(); if(error){showToast(error.message); return null;} return data; }
async function updateRow(table, id, payload){ const {data,error} = await sb.from(table).update(payload).eq('id', id).select().single(); if(error){showToast(error.message); return null;} return data; }
async function deleteRow(table, id){ const {error} = await sb.from(table).delete().eq('id', id); if(error){showToast(error.message); return false;} return true; }

async function createClient(p){ const d=await createRow('clients',p); if(d){ state.clients.push(d); state.clients.sort((a,b)=>a.name.localeCompare(b.name)); } return d; }
async function updateClient(id,p){ const d=await updateRow('clients',id,p); if(d){ const i=state.clients.findIndex(x=>x.id===id); state.clients[i]=d; } return d; }
async function createVolunteer(p){ const d=await createRow('volunteers',p); if(d){ state.volunteers.push(d); state.volunteers.sort((a,b)=>a.name.localeCompare(b.name)); } return d; }
async function updateVolunteer(id,p){ const d=await updateRow('volunteers',id,p); if(d){ const i=state.volunteers.findIndex(x=>x.id===id); state.volunteers[i]=d; } return d; }
async function createDriver(p){ const d=await createRow('drivers',p); if(d){ state.drivers.push(d); state.drivers.sort((a,b)=>a.name.localeCompare(b.name)); } return d; }
async function updateDriver(id,p){ const d=await updateRow('drivers',id,p); if(d){ const i=state.drivers.findIndex(x=>x.id===id); state.drivers[i]=d; } return d; }
async function createRequest(p){ const d=await createRow('requests',p); if(d){ state.requests.unshift(d); } return d; }
async function updateRequest(id,p){ const d=await updateRow('requests',id,{...p, updated_at:new Date().toISOString()}); if(d){ const i=state.requests.findIndex(x=>x.id===id); state.requests[i]=d; } return d; }
async function deleteRequest(id){ const ok=await deleteRow('requests',id); if(ok){ state.requests = state.requests.filter(x=>x.id!==id); } return ok; }
async function updateSettings(p){ const {data,error} = await sb.from('app_settings').update(p).eq('id',1).select().single(); if(error){showToast(error.message); return;} state.settings = {...state.settings, ...data}; }
async function addInvite(email, role){
  const {data:d,error} = await sb.from('invites').upsert({email: email.toLowerCase().trim(), role: role||'dispatcher'}).select().single();
  if(error){ showToast(error.message); return null; }
  state.invites = state.invites.filter(i=>i.email!==d.email).concat(d); return d;
}
// Used invites stay in the database; only show the ones still waiting for a sign-up
function pendingInvites(){ const taken = new Set(state.profiles.map(p=>p.email.toLowerCase())); return state.invites.filter(i=>!taken.has(i.email.toLowerCase())); }
async function removeInvite(email){ const {error}=await sb.from('invites').delete().eq('email',email); if(!error) state.invites = state.invites.filter(i=>i.email!==email); }
async function updateProfileRole(id, role){ const d=await updateRow('profiles', id, {role}); if(d){ const i=state.profiles.findIndex(x=>x.id===id); state.profiles[i]=d; } }
async function removeProfile(id){ const ok = await deleteRow('profiles', id); if(ok){ state.profiles = state.profiles.filter(p=>p.id!==id); showToast('Removed from app access (their login still exists in Supabase Auth)'); } }

/* ============================= Layout ============================= */
function layout(innerHtml){
  if(!state.session){ return authScreen(); }
  if(state.session && !state.profile && !state.loading){
    return `<div class="header"><span class="title">Nekius Dispatch</span></div>
    <div class="main" style="max-width:420px;"><div class="card">
      <b>No access yet</b>
      <div class="sub" style="margin-top:6px;">You're signed in as ${esc(state.session.user?.email||'')}, but this account hasn't been given access. Ask an Editor to invite this email address.</div>
      <div class="btn btn-outline" style="margin-top:14px;" data-action="logout">LOG OUT</div>
    </div></div>`;
  }
  if(state.loading){ return `<div class="header"><span class="title">Nekius Dispatch</span></div><div class="main"><div class="empty">Loading…</div></div>`; }
  const titles = {dashboard:'Dashboard',dispatch:'Dispatch',clients:'Clients',volunteers:'Volunteers',drivers:'Drivers',history:'Request History',settings:'Settings',client:'Client',volunteer:'Volunteer',driver:'Driver'};
  const isProfilePage = ['client','volunteer','driver'].includes(state.route);
  return `
    <div class="header">
      ${isProfilePage ? `<button class="icon-btn" data-action="go-back" title="Back">&#8592;</button>` : ''}
      <button class="icon-btn" data-action="toggle-menu">&#9776;</button>
      <span class="title">${titles[state.route]||'Nekius Dispatch'}</span>
      <button class="avatar" data-action="open-modal" data-modal="myProfile" title="My profile">${esc(initials(state.profile?.name||state.profile?.email||'?'))}</button>
    </div>
    <div class="main">${innerHtml}</div>
    <div class="footer">Nekius Dispatch &mdash; ${esc(state.profile?.role||'')}</div>
    ${state.menuOpen ? hamburgerMenu() : ''}
    ${state.modal ? modalHtml() : ''}
    ${state.toast ? `<div class="toast">${esc(state.toast)}</div>` : ''}
  `;
}

function hamburgerMenu(){
  const items = [
    ['dashboard','Dashboard'], ['dispatch','Dispatch'], ['clients','Clients'],
    ['volunteers','Volunteers'], ['drivers','Drivers'], ['history','Request History'],
  ];
  if(state.profile?.role === 'editor') items.push(['settings','Settings']);
  return `<div class="hamburger-menu" data-action="close-menu">
    <div class="hamburger-panel">
      <div style="font-weight:800;font-size:18px;margin-bottom:14px;">Nekius Dispatch</div>

    </div>
  </div>`;
}

/* ============================= Dashboard ============================= */
// A request is "open" while it's waiting for someone to be assigned: a volunteer, or a driver for either leg
function needsPerson(r){
  return r.status==='open' || r.status==='assigned' || r.status==='finished'
    || (r.status==='posted_pickup' && !r.pickup_driver_id) || (r.status==='posted_return' && !r.return_driver_id);
}
// kept as a list: number-like object keys would be reordered by JavaScript
const PERIODS = [['today','Today'], ['7','7 days'], ['30','30 days'], ['90','90 days'], ['365','1 year'], ['all','All time']];
function inPeriod(iso, period){
  if(!iso) return false;
  const d = new Date(iso);
  if(period==='all') return true;
  if(period==='today') return d.toDateString() === new Date().toDateString();
  return Date.now() - d.getTime() <= Number(period) * 86400000;
}
function topList(kind, counts){
  const rows = Object.entries(counts).map(([id,n])=>[byId(state[kind+'s'], id), n]).filter(([p])=>p).sort((a,b)=> b[1]-a[1] || a[0].name.localeCompare(b[0].name)).slice(0,5);
  if(!rows.length) return `<div class="sub" style="padding:6px 0;">No completed calls in this period.</div>`;
  return rows.map(([p,n],i)=>`<div class="top-row"><span class="rank">${i+1}</span><span class="name-link" data-nav="${kind}" data-id="${p.id}">${esc(p.name)}</span><b>${n}</b></div>`).join('');
}
function dashboard(){
  const active = state.requests.filter(r=>!DONE.includes(r.status));
  const completed = state.requests.filter(r=>r.status==='completed');
  const doneIn = period => completed.filter(r=>inPeriod(r.completed_at || r.updated_at, period)).length;
  const period = state.topPeriod || '30';
  const volCounts = {}, drvCounts = {};
  completed.filter(r=>inPeriod(r.completed_at || r.updated_at, period)).forEach(r=>{
    if(r.volunteer_id) volCounts[r.volunteer_id] = (volCounts[r.volunteer_id]||0) + 1;
    // each leg a driver drove counts as one trip
    if(r.pickup_driver_id) drvCounts[r.pickup_driver_id] = (drvCounts[r.pickup_driver_id]||0) + 1;
    if(r.return_driver_id) drvCounts[r.return_driver_id] = (drvCounts[r.return_driver_id]||0) + 1;
  });
  return `
    <div class="section-title">Welcome back${state.profile?.name ? ', ' + esc(state.profile.name) : ''}</div>
    <div class="btn btn-primary" data-action="open-modal" data-modal="newRequest" style="margin-bottom:14px;">+ NEW REQUEST</div>
    <div class="stat-grid">
      <div class="card stat" data-action="go-dispatch" data-tab="open">
        <div class="big">${active.filter(needsPerson).length}</div><div class="label">Open requests</div>
        <div class="sub">Waiting for a volunteer or driver</div>
      </div>
      <div class="card stat" data-action="go-dispatch">
        <div class="big">${active.length}</div><div class="label">In progress</div>
        <div class="sub">From Open until Completed</div>
      </div>
      <div class="card stat" data-nav="history">
        <div class="big">${completed.length}</div><div class="label">Completed</div>
        <div class="stat-lines">
          <div><span>Today</span><b>${doneIn('today')}</b></div>
          <div><span>Last 7 days</span><b>${doneIn('7')}</b></div>
          <div><span>Last 30 days</span><b>${doneIn('30')}</b></div>
          <div><span>All time</span><b>${completed.length}</b></div>
        </div>
      </div>
    </div>
    <div class="card" style="margin-top:12px;">
      <div class="row-between"><b style="font-size:17px;">Top volunteers &amp; drivers</b></div>
      <div class="chip-row" style="margin:10px 0 4px;">${PERIODS.map(([k,l])=>`<div class="chip ${period===k?'active':''}" data-action="set-top-period" data-period="${k}">${l}</div>`).join('')}</div>
      <div class="two-col top-cols">
        <div><div class="top-head">Volunteers <span class="sub">&middot; calls</span></div>${topList('volunteer', volCounts)}</div>
        <div><div class="top-head">Drivers <span class="sub">&middot; trips</span></div>${topList('driver', drvCounts)}</div>
      </div>
    </div>
  `;
}

/* ============================= Dispatch ============================= */
function dispatch(){
  const tabs = [...STATUS_FLOW, 'not_covered', 'cancelled'];
  const counts = {}; tabs.forEach(t=> counts[t] = state.requests.filter(r=>r.status===t).length);
  const q = state.dispatchSearch.trim();
  let list = state.requests.filter(r=> r.status === state.dispatchTab);
  if(q) list = list.filter(r=> String(r.id).includes(q));
  return `
    <div class="btn btn-primary" data-action="open-modal" data-modal="newRequest">+ NEW REQUEST</div>
    <div class="search-wrap" style="margin-top:12px;">
      <input placeholder="Search by request ID…" value="${esc(state.dispatchSearch)}" data-live="dispatchSearch">
    </div>
    <div class="tabs">
      ${tabs.map(t=>`<div class="tab ${state.dispatchTab===t?'active':''}" data-action="dispatch-tab" data-tab="${t}">${TAB_LABELS[t]||STATUS_LABELS[t]}<span class="count">${counts[t]}</span></div>`).join('')}
    </div>
    ${list.length===0 ? `<div class="empty">No requests in ${TAB_LABELS[state.dispatchTab]||STATUS_LABELS[state.dispatchTab]}.</div>` : list.map(requestCard).join('')}
  `;
}

function personLink(kind, p, withAddress){
  if(!p) return `<span class="sub">Not assigned yet</span>`;
  const phone = p.phone ? ` &middot; <a href="tel:${esc(p.phone.replace(/[^\d+]/g,''))}">${esc(p.phone)}</a>` : '';
  const addr = withAddress && p.address ? `<div class="person-sub">${esc(p.address)}</div>` : '';
  return `<span class="name-link" data-nav="${kind}" data-id="${p.id}">${esc(p.name)}</span>${phone}${addr}`;
}

// One-line summary used for Completed / Not Covered / Cancelled; tap to open the full card
function requestRow(r){
  const c = byId(state.clients, r.client_id), v = byId(state.volunteers, r.volunteer_id);
  const pd = byId(state.drivers, r.pickup_driver_id), rd = byId(state.drivers, r.return_driver_id);
  const by = profileName(r.created_by);
  const parts = [c?.name || 'No client', v && `Vol: ${v.name}`, pd && `Pickup: ${pd.name}`, rd && `Return: ${rd.name}`, by && `by ${by}`].filter(Boolean);
  return `<div class="req-row" data-action="toggle-expand" data-id="${r.id}">
    <span class="status-dot status-${r.status}" title="${STATUS_LABELS[r.status]}"></span>
    <b>#${r.id}</b><span class="row-text">${parts.map(esc).join(' · ')}</span>
    <span class="sub">${fmtShortDate(r.completed_at || r.updated_at)}</span>
  </div>`;
}

function requestCard(r){
  if(DONE.includes(r.status) && !state.expanded[r.id]) return requestRow(r);
  const client = byId(state.clients, r.client_id);
  const vol = byId(state.volunteers, r.volunteer_id);
  const pdriver = byId(state.drivers, r.pickup_driver_id);
  const rdriver = byId(state.drivers, r.return_driver_id);
  const by = profileName(r.created_by);
  const step = STATUS_FLOW.indexOf(r.status);
  // once the bags are back on the return leg, the pickup driver is just history
  const pickupFaded = ['finished','posted_return','completed'].includes(r.status) || DONE.includes(r.status);
  const showPickup = pdriver || step >= 1;
  const showReturn = rdriver || step >= 4;
  const btn = (label, attrs, primary) => `<button class="btn ${primary?'btn-primary':'btn-outline'}" ${attrs}>${label}</button>`;
  const assign = (field, label) => btn(label, `data-action="assign-person" data-id="${r.id}" data-field="${field}"`, true);
  const advance = (to, label) => btn(label, `data-action="advance" data-id="${r.id}" data-to="${to}"`, true);
  let actions = '';
  switch(r.status){
    case 'open': actions = assign('volunteer_id', 'Assign Volunteer'); break;
    case 'assigned': actions = btn('Copy Post Msg', `data-action="copy-post" data-id="${r.id}" data-leg="pickup"`) + assign('pickup_driver_id', 'Assign Pickup Driver'); break;
    case 'posted_pickup': actions = pdriver
        ? btn('Copy Driver Msg', `data-action="copy-driver" data-id="${r.id}" data-leg="pickup"`) + advance('delivered', '&check; Delivered to volunteer')
        : btn('Copy Post Msg', `data-action="copy-post" data-id="${r.id}" data-leg="pickup"`) + assign('pickup_driver_id', 'Assign Pickup Driver'); break;
    case 'delivered': actions = advance('finished', '&check; Washing finished'); break;
    case 'finished': actions = btn('Copy Post Msg', `data-action="copy-post" data-id="${r.id}" data-leg="return"`) + assign('return_driver_id', 'Assign Return Driver'); break;
    case 'posted_return': actions = rdriver
        ? btn('Copy Driver Msg', `data-action="copy-driver" data-id="${r.id}" data-leg="return"`) + advance('completed', '&check; Completed')
        : btn('Copy Post Msg', `data-action="copy-post" data-id="${r.id}" data-leg="return"`) + assign('return_driver_id', 'Assign Return Driver'); break;
  }
  return `<div class="card status-${r.status}">
    <div class="req-head">
      <div><b>#${r.id}</b>${by ? `<span class="by">by ${esc(by)}</span>` : ''}</div>
      <div class="req-tools">
        ${statusBadgeInteractive(r)}
        <button class="icon-only" title="Edit request" data-action="open-modal" data-modal="editRequest" data-id="${r.id}">${ICON_EDIT}</button>
        <button class="icon-only danger" title="Delete request" data-action="delete-request" data-id="${r.id}">${ICON_TRASH}</button>
      </div>
    </div>
    <div class="req-grid">
      <span class="k">Client</span><span class="v">${personLink('client', client, true)}</span>
      <span class="k">Bags</span><span class="v">${bagsLabel(r.bags)} bag's</span>
      <span class="k">When</span><span class="v">${fmtDateTime(r.requested_for)}</span>
      <span class="k">Volunteer</span><span class="v">${personLink('volunteer', vol, true)}</span>
      ${showPickup ? `<span class="k ${pickupFaded?'faded':''}">Pickup driver</span><span class="v ${pickupFaded?'faded':''}">${personLink('driver', pdriver)}</span>` : ''}
      ${showReturn ? `<span class="k">Return driver</span><span class="v">${personLink('driver', rdriver)}</span>` : ''}
    </div>
    ${r.notes ? `<div class="private">&#128274; ${esc(r.notes)}</div>` : ''}
    ${actions ? `<div class="req-actions">${actions}</div>` : ''}
    ${DONE.includes(r.status) ? `<div style="text-align:center;margin-top:10px;"><a class="sub" style="cursor:pointer;" data-action="toggle-expand" data-id="${r.id}">Show less &#9650;</a></div>` : ''}
  </div>`;
}

function statusBadgeInteractive(r){
  return `<span class="badge status-${r.status}" data-action="status-menu" data-id="${r.id}">${STATUS_LABELS[r.status]} &#9662;</span>`;
}

const VOL_SORTS = { name:'Name (A–Z)', readiness:'Due to wash first', capacity:'Most bags first', frequency:'Washes most often first', newest:'Newest first' };
function sortVolunteers(list){
  const rank = {amber:0, gray:1, green:2};
  const cap = v => ({'1':1,'2':2,'3':3,'4plus':4}[v.bag_capacity]||0);
  const freq = v => ({weekly:4,three_monthly:3,twice_monthly:2,once_monthly:1}[v.wash_frequency]||0);
  const byName = (a,b) => a.name.localeCompare(b.name);
  const cmp = {
    name: byName,
    readiness: (a,b) => (rank[volunteerReadiness(a)] - rank[volunteerReadiness(b)]) || byName(a,b),
    capacity: (a,b) => (cap(b) - cap(a)) || byName(a,b),
    frequency: (a,b) => (freq(b) - freq(a)) || byName(a,b),
    newest: (a,b) => new Date(b.created_at) - new Date(a.created_at),
  }[state.volSort] || byName;
  // volunteers free on more of the chosen days come first; the chosen sort orders the rest
  const free = v => state.volDays.filter(d=>availableOn(v,d)).length;
  return list.slice().sort((a,b)=> (free(b) - free(a)) || cmp(a,b));
}
function volSortControls(){
  const today = new Date().getDay();
  const filtersOn = state.volDays.length || state.volSort !== 'name';
  return `<div class="sort-row"><label>Sort by</label>
      <select data-setstate="volSort">${Object.entries(VOL_SORTS).map(([k,l])=>`<option value="${k}" ${state.volSort===k?'selected':''}>${l}</option>`).join('')}</select>
      ${filtersOn ? `<a class="clear-all" data-action="clear-vol-filters">Clear all</a>` : ''}
    </div>
    <div class="sub" style="margin-top:8px;">Available on <span class="hint">(tap to choose one or more days, tap again to remove)</span></div>
    <div class="chip-row" style="margin-top:6px;">${WORK_DAYS.map(i=>`<div class="chip ${state.volDays.includes(i)?'active':''}" data-action="toggle-vol-day" data-day="${i}">${DAY_SHORT[i]}${i===today?' &middot; today':''}</div>`).join('')}</div>`;
}
function volunteerTags(v){
  let t = '';
  const days = daysLabel(v, state.volDays);
  if(state.volDays.length && days) t += `<span class="tag">Available ${state.volDays.length===1 ? DAY_LONG[state.volDays[0]] : days}</span>`;
  if(v.status==='temporary_inactive') t += `<span class="tag gray">Away</span>`;
  return t;
}
function volunteerSub(v){
  return [v.phone, daysLabel(v) && `Available: ${daysLabel(v)}`, v.bag_capacity && capacityLabel(v.bag_capacity)].filter(Boolean).join(' · ');
}
function plural(n, word){ return `${n} ${word}${n===1?'':'s'}`; }
function clientCallTags(c){
  const reqs = state.requests.filter(r=>r.client_id===c.id);
  const done = reqs.filter(r=>r.status==='completed').length, active = reqs.filter(r=>!DONE.includes(r.status)).length;
  return `<span class="tag ${done?'':'gray'}">${plural(done,'call')} done</span>${active ? `<span class="tag gray">${active} active</span>` : ''}`;
}
function matchesSearch(p, q){
  if(!q) return true; q = q.toLowerCase();
  return [p.name, p.phone, p.address].some(x => (x||'').toLowerCase().includes(q));
}

function inlinePicker(field){

  const r = byId(state.requests, state.modal.id); if(!r) return '';
  return `<h2>Set status for #${r.id}</h2>
    ${ALL_STATUSES.map(s=>`<div class="list-item" data-action="set-status" data-id="${r.id}" data-status="${s}">
        <span class="badge status-${s}">${TAB_LABELS[s]||STATUS_LABELS[s]}</span>${r.status===s?' <b>&check; current</b>':''}
      </div>`).join('')}`;
}

// Assign a volunteer / pickup driver / return driver straight from a request card
function assignPersonModal(){
  const r = byId(state.requests, state.modal.id); if(!r) return '';
  const field = state.modal.field;
  const title = {volunteer_id:'Assign Volunteer', pickup_driver_id:'Assign Pickup Driver', return_driver_id:'Assign Return Driver'}[field];
  const client = byId(state.clients, r.client_id);
  return `<h2>${title} &mdash; #${r.id}</h2>
    <div class="sub" style="margin-bottom:10px;">${esc(client?.name||'')} &middot; ${fmtDateTime(r.requested_for)}</div>
    ${pickerSearchBox(field)}
    ${field==='volunteer_id' ? `<div style="margin-top:10px;">${volSortControls()}</div>` : ''}
    ${pickerResults(field)}`;
}

function myProfileModal(){
  const me = state.profile || {};
  if(state.draft._editing){
    return `<h2>Edit my name</h2>
      <div class="field"><input id="my-name" value="${esc(me.name||'')}" placeholder="Your name"></div>
      <div class="btn-row" style="margin-top:14px;">
        <button class="btn btn-outline" data-action="set-draft" data-field="_editing" data-value="">Cancel</button>
        <button class="btn btn-primary" data-action="save-my-name">Save</button>
      </div>`;
  }
  return `<h2>My profile</h2>
    <div style="display:flex;align-items:center;gap:14px;">
      <div class="avatar" style="width:52px;height:52px;font-size:18px;background:var(--blue);">${esc(initials(me.name||me.email||'?'))}</div>
      <div><div style="font-size:20px;font-weight:800;">${esc(me.name || 'No name yet')}</div>
        <div class="sub">${esc(me.email||'')} &middot; ${me.role==='editor'?'Editor':'Dispatcher'}</div></div>
    </div>
    <div class="btn-row" style="margin-top:18px;">
      <button class="btn btn-outline" data-action="set-draft" data-field="_editing" data-value="1">${ICON_EDIT} Edit name</button>
      <button class="btn btn-danger" data-action="logout">Log out</button>
    </div>`;
}

/* ============================= Event delegation ============================= */
let initialized = false;
function initEvents(){
  if(initialized) return; initialized = true;
  document.addEventListener('click', async (e)=>{
    if(e.target.closest('.modal-overlay') && !e.target.closest('.modal') && e.target.closest('[data-action="overlay-click"]')){
      closeModal(); return;
    }
    const navEl = e.target.closest('[data-nav]');
    const actionEl = e.target.closest('[data-action]');

    // A nav element wins when it is nested inside the action element (e.g. menu items inside the menu overlay)
    if(navEl && (!actionEl || actionEl.contains(navEl))){
      const r = navEl.getAttribute('data-nav');
      if(navEl.classList.contains('nav-item')) state.navStack = [];
      else if(['client','volunteer','driver'].includes(r)) state.navStack.push({route: state.route, routeId: state.routeId});
      state.route = r; state.routeId = navEl.getAttribute('data-id')||null; state.menuOpen=false; state.modal=null; state.draft={}; state.modalStack=[];
      render(); window.scrollTo(0,0); return;
    }
    if(!actionEl) return;
    const action = actionEl.getAttribute('data-action');

    switch(action){
      case 'toggle-menu': state.menuOpen = !state.menuOpen; render(); break;
      case 'close-menu': if(e.target===actionEl) { state.menuOpen=false; render(); } break;
      case 'logout': await sb.auth.signOut(); state.session=null; state.profile=null; state.menuOpen=false; state.modal=null; state.draft={}; state.route='dashboard'; state.authMode='login'; state.authError=''; render(); break;
      case 'switch-auth': state.authMode = state.authMode==='login'?'signup':'login'; state.authError=''; state.authInfo=''; render(); break;
      case 'do-login': {
        const email = document.getElementById('auth-email').value.trim();
        const password = document.getElementById('auth-password').value;
        const {error} = await sb.auth.signInWithPassword({email,password});
        if(error){ state.authError = friendlyAuthError(error); state.authInfo=''; render(); } else { state.authInfo=''; await onAuthed(); }
        break;
      }
      case 'do-signup': {
        const email = document.getElementById('auth-email').value.trim();
        const password = document.getElementById('auth-password').value;
        if(!email || password.length < 6){ state.authError = 'Enter your email and a password of at least 6 characters.'; render(); break; }
        const name = (document.getElementById('auth-name')?.value||'').trim();
        if(!name){ state.authError = 'Please enter your name.'; render(); break; }
        const {data, error} = await sb.auth.signUp({email, password, options:{data:{name}}});
        if(error){ state.authError = friendlyAuthError(error); render(); }
        else if(!data.session){ state.authMode='login'; state.authError=''; state.authInfo = 'Account created. Check your email for a confirmation link, then come back and log in.'; render(); }
        else { state.authError=''; await onAuthed(); }
        break;
      }
      case 'open-modal':
        state.modal = {type: actionEl.getAttribute('data-modal'), id: actionEl.getAttribute('data-id')};
        state.draft = {}; state.modalStack = []; state.pickerSearch = {}; state.menuOpen = false;
        if(state.modal.type==='newRequest'){ state.volDays = defaultVolDays(); }
        render(); break;
      case 'close-modal': closeModal(); break;
      case 'toggle-vol-day': {
        const day = Number(actionEl.getAttribute('data-day'));
        state.volDays = state.volDays.includes(day) ? state.volDays.filter(d=>d!==day) : [...state.volDays, day].sort();
        render(); break;
      }
      case 'clear-vol-filters':
        state.volDays = []; state.volSort = 'name'; state.draft.volSearch = ''; state.pickerSearch.volunteer_id = '';
        if(state.route==='volunteers') state.listFilter = 'active';
        render(); break;
      case 'set-top-period': state.topPeriod = actionEl.getAttribute('data-period'); render(); break;
      case 'go-dispatch': state.route = 'dispatch'; if(actionEl.getAttribute('data-tab')) state.dispatchTab = actionEl.getAttribute('data-tab'); state.navStack = []; render(); window.scrollTo(0,0); break;
      case 'go-back': {
        const prev = state.navStack.pop();
        if(prev){ state.route = prev.route; state.routeId = prev.routeId; }
        else { state.route = state.route + 's'; state.routeId = null; } // e.g. client -> clients
        render(); window.scrollTo(0,0); break;
      }
      case 'toggle-day': {
        const day = Number(actionEl.getAttribute('data-day')); const days = new Set(state.draft.available_days||[]);
        days.has(day) ? days.delete(day) : days.add(day);
        state.draft.available_days = [...days].sort(); render(); break;
      }
      case 'push-person': {
        // open "Add client/volunteer/driver" on top of the current window; saving comes back here with it selected
        const kind = actionEl.getAttribute('data-kind'); const field = actionEl.getAttribute('data-field');
        const typed = (state.pickerSearch[field]||'').trim();
        state.modalStack.push({modal: state.modal, draft: state.draft, field});
        state.modal = {type: 'add' + kind.charAt(0).toUpperCase() + kind.slice(1)};
        state.draft = {}; state.pendingPrefill = typed && !/^[\d\s()+-]+$/.test(typed) ? {name: typed} : null;
        render(); break;
      }
      case 'pick': {
        const field = actionEl.getAttribute('data-field'); const value = actionEl.getAttribute('data-value');
        state.pickerSearch[field] = '';
        if(state.modal?.type==='assignPerson'){ await assignToRequest(state.modal.id, field, value); }
        else { state.draft[field] = value; render(); }
        break;
      }
      case 'unpick': { const f = actionEl.getAttribute('data-field'); state.draft[f] = null; state.pickerSearch[f] = ''; if(f==='volunteer_id') state.draft._showVol = '1'; render(); break; }
      case 'clear-field': state.draft[actionEl.getAttribute('data-field')] = null; render(); break;
      case 'assign-person': {
        const r = byId(state.requests, Number(actionEl.getAttribute('data-id')));
        state.modal = {type:'assignPerson', id:r.id, field: actionEl.getAttribute('data-field')};
        state.modalStack = []; state.pickerSearch = {}; state.draft = {};
        state.volDays = defaultVolDays(r.requested_for);
        render(); break;
      }
      case 'advance': {
        const id = Number(actionEl.getAttribute('data-id')); const to = actionEl.getAttribute('data-to');
        const saved = await updateRequest(id, {status: to});
        if(saved){ if(state.route==='dispatch') state.dispatchTab = to; showToast(`#${id} moved to ${TAB_LABELS[to]||STATUS_LABELS[to]}`); }
        break;
      }
      case 'toggle-expand': { const id = actionEl.getAttribute('data-id'); state.expanded[id] = !state.expanded[id]; render(); break; }
      case 'save-my-name': {
        const name = document.getElementById('my-name').value.trim();
        if(!name){ showToast('Type your name'); break; }
        const {error} = await sb.rpc('set_my_name', {new_name: name});
        if(error){ showToast(error.message); break; }
        state.profile.name = name; const me = byId(state.profiles, state.profile.id); if(me) me.name = name;
        state.draft._editing = ''; showToast('Saved'); break;
      }
      case 'dispatch-tab': state.dispatchTab = actionEl.getAttribute('data-tab'); render(); break;
      case 'list-filter': state.listFilter = actionEl.getAttribute('data-f'); render(); break;
      case 'toggle-settings': { const k=actionEl.getAttribute('data-key'); state.settingsExpanded[k]=!state.settingsExpanded[k]; render(); break; }
      case 'toggle-mashilach': {
        state.draft.is_mashilach = !state.draft.is_mashilach;
        if(state.draft.is_mashilach){ state.draft.address = state.settings.mashilach_address||state.draft.address; state.draft.note = state.settings.mashilach_note||state.draft.note; }
        render(); break;
      }
      case 'toggle-chip': { const f=actionEl.getAttribute('data-field'); state.draft[f]=!state.draft[f]; render(); break; }
      case 'set-draft': { const f=actionEl.getAttribute('data-field'); state.draft[f]=actionEl.getAttribute('data-value'); render(); break; }
      case 'save-person': await savePerson(actionEl.getAttribute('data-kind'), actionEl.getAttribute('data-id')||null); break;
      case 'save-new-request': await saveNewRequest(); break;
      case 'save-edit-request': await saveEditRequest(Number(actionEl.getAttribute('data-id'))); break;
      case 'delete-request': if(confirm('Delete this request? This cannot be undone.')){ await deleteRequest(Number(actionEl.getAttribute('data-id'))); render(); } break;
      case 'status-menu': state.modal = {type:'statusMenu', id:Number(actionEl.getAttribute('data-id'))}; render(); break;
      case 'set-status': {
        const id = Number(actionEl.getAttribute('data-id')); const status = actionEl.getAttribute('data-status');
        await updateRequest(id, {status}); state.modal=null; state.dispatchTab = status; render(); break;
      }
      case 'copy-post': {
        const r = byId(state.requests, Number(actionEl.getAttribute('data-id'))); const leg = actionEl.getAttribute('data-leg');
        copyToClipboard(shortLegMessage(r, leg)); break;
      }
      case 'copy-driver': {
        const r = byId(state.requests, Number(actionEl.getAttribute('data-id'))); const leg = actionEl.getAttribute('data-leg');
        copyToClipboard(driverMessage(r, leg)); break;
      }
      case 'save-mashilach-settings': await updateSettings({mashilach_address: document.getElementById('set-mashilach-address').value, mashilach_note: document.getElementById('set-mashilach-note').value}); showToast('Saved'); render(); break;
      case 'save-postmsg-settings': await updateSettings({post_message_template: {before:document.getElementById('set-pm-before').value, between:document.getElementById('set-pm-between').value, after:document.getElementById('set-pm-after').value}}); showToast('Saved'); render(); break;
      case 'save-drivermsg-settings': await updateSettings({driver_message_pickup_template: document.getElementById('set-dm-pickup').value, driver_message_return_template: document.getElementById('set-dm-return').value}); showToast('Saved'); render(); break;
      case 'send-invite': {
        const email = (state.inviteEmail||'').trim();
        const role = state.inviteRole || 'dispatcher';
        if(!/^\S+@\S+\.\S+$/.test(email)){ showToast('Enter a valid email'); break; }
        if(await addInvite(email, role)){ state.inviteEmail = ''; state.inviteRole = 'dispatcher'; }
        if(state.invites.some(i=>i.email===email.toLowerCase())) showToast(`Invited as ${role==='editor'?'Editor':'Dispatcher'} — they can now sign up with ${email}`);
        break;
      }
      case 'set-invite-role': state.inviteRole = actionEl.getAttribute('data-role'); render(); break;
      case 'remove-invite': await removeInvite(actionEl.getAttribute('data-email')); render(); break;
      case 'toggle-role': await updateProfileRole(actionEl.getAttribute('data-id'), actionEl.getAttribute('data-role')); render(); break;
      case 'remove-user': if(confirm('Remove this user\'s access?')){ await removeProfile(actionEl.getAttribute('data-id')); render(); } break;
    }
  });

  document.addEventListener('input', (e)=>{
    const liveEl = e.target.closest('[data-live]');
    if(liveEl){
      const path = liveEl.getAttribute('data-live').split('.');
      if(path.length===1) state[path[0]] = liveEl.value;
      else state[path[0]][path[1]] = liveEl.value;
      // re-render so the list filters while typing, then put the cursor back
      const key = liveEl.getAttribute('data-live'); const pos = liveEl.selectionStart;
      render();
      const again = document.querySelector(`[data-live="${key}"]`);
      if(again){
        again.focus();
        // email inputs don't support setSelectionRange; re-setting the value puts the cursor at the end instead
        try{ again.setSelectionRange(pos,pos); }catch(_){ const v = again.value; again.value = ''; again.value = v; }
      }
      return;
    }
    const bindEl = e.target.closest('[data-bind]');
    if(bindEl){ state.draft[bindEl.getAttribute('data-bind')] = bindEl.value; }
  });
  document.addEventListener('change', (e)=>{
    if(e.target.closest('[data-live]')) return;
    const setEl = e.target.closest('[data-setstate]');
    if(setEl){ state[setEl.getAttribute('data-setstate')] = setEl.value; render(); return; }
    const bindEl = e.target.closest('[data-bind]');
    if(bindEl){
      state.draft[bindEl.getAttribute('data-bind')] = bindEl.value;
      // volunteers available on the requested day float to the top of the picker
      if(bindEl.getAttribute('data-bind')==='requested_for' && bindEl.value){ state.volDays = defaultVolDays(bindEl.value); render(); }
    }
  });
}

function closeModal(){
  const prev = state.modalStack.pop();
  if(prev){ state.modal = prev.modal; state.draft = prev.draft; }
  else { state.modal = null; state.draft = {}; state.pickerSearch = {}; }
  render();
}

// Filling in the person a step needs moves the request on by itself
function autoStatus(r){
  if(r.status==='open' && r.volunteer_id) return r.pickup_driver_id ? 'posted_pickup' : 'assigned';
  if(r.status==='assigned' && r.pickup_driver_id) return 'posted_pickup';
  if(r.status==='finished' && r.return_driver_id) return 'posted_return';
  return r.status;
}
async function assignToRequest(id, field, value){
  const r = byId(state.requests, id);
  const patch = {[field]: value};
  const next = autoStatus({...r, ...patch});
  if(next !== r.status) patch.status = next;
  const saved = await updateRequest(id, patch);
  if(!saved) return;
  state.modal = null; state.draft = {}; state.modalStack = []; state.pickerSearch = {};
  if(state.route==='dispatch') state.dispatchTab = saved.status;
  showToast(next !== r.status ? `#${id} moved to ${TAB_LABELS[next]||STATUS_LABELS[next]}` : 'Saved');
}

async function saveNewRequest(){
  const d = state.draft;
  if(!d.client_id){ showToast('Select a client'); return; }
  const payload = {
    client_id: d.client_id, bags: Number(d.bags)||1,
    requested_for: d.requested_for ? new Date(d.requested_for).toISOString() : null,
    volunteer_id: d.volunteer_id || null, notes: d.notes||'', status: d.volunteer_id ? 'assigned' : 'open'
  };
  const saved = await createRequest(payload);
  if(!saved) return;
  state.modal = null; state.draft = {}; state.route = 'dispatch'; state.dispatchTab = saved.status; render();
}
async function saveEditRequest(id){
  const d = state.draft;
  const r = byId(state.requests, id);
  const patch = {
    client_id: d.client_id||null, bags: Number(d.bags)||1, volunteer_id: d.volunteer_id||null,
    pickup_driver_id: d.pickup_driver_id||null, return_driver_id: d.return_driver_id||null,
    requested_for: d.requested_for ? new Date(d.requested_for).toISOString() : null,
    notes: d.notes||''
  };
  patch.status = autoStatus({...r, ...patch});
  const saved = await updateRequest(id, patch);
  if(!saved) return;
  if(state.route==='dispatch') state.dispatchTab = saved.status;
  state.modal = null; state.draft = {}; render();
}
async function savePerson(kind, id){
  const COLS = {
    client: ['name','phone','address','note','private_note','is_mashilach','status'],
    volunteer: ['name','phone','address','note','private_note','status','temp_inactive_from','temp_inactive_until','bag_capacity','wash_frequency','available_days'],
    driver: ['name','phone','email','address','contact_sms','contact_whatsapp','status'],
  }[kind];
  const d = {};
  for(const k of COLS){ if(k in state.draft){ const val = state.draft[k]; d[k] = (typeof val==='string' && val.trim()==='') ? null : (typeof val==='string' ? val.trim() : val); } }
  if(!d.name){ showToast('Name is required'); return; }
  if(kind==='volunteer' && d.status!=='temporary_inactive'){ d.temp_inactive_from = null; d.temp_inactive_until = null; }
  if(kind==='volunteer' && d.status==='temporary_inactive' && !d.temp_inactive_until){ showToast('Pick the "Until" date'); return; }
  let saved = null;
  if(kind==='client'){ saved = id ? await updateClient(id, d) : await createClient(d); }
  if(kind==='volunteer'){ saved = id ? await updateVolunteer(id, d) : await createVolunteer(d); }
  if(kind==='driver'){ saved = id ? await updateDriver(id, d) : await createDriver(d); }
  if(!saved) return; // keep the form open so nothing typed is lost
  const prev = state.modalStack.pop();
  if(prev){
    // came here from a request: go back to it with the new person already chosen
    if(prev.modal.type==='assignPerson'){ await assignToRequest(prev.modal.id, prev.field, saved.id); return; }
    state.modal = prev.modal; state.draft = {...prev.draft, [prev.field]: saved.id};
    state.pickerSearch[prev.field] = ''; render(); return;
  }
  state.modal = null; state.draft = {}; render();
}

/* ============================= Auth bootstrap ============================= */
async function onAuthed(){
  const {data:{session}} = await sb.auth.getSession();
  state.session = session;
  if(session){
    const {data:profile} = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
    state.profile = profile;
    if(!profile){ state.loading = false; render(); return; }
    state.loading = true; render();
    await loadAll();
  } else {
    render();
  }
}

sb.auth.onAuthStateChange((event, session)=>{
  state.session = session;
  if(!session){ state.profile=null; state.loading=true; render(); }
});

initEvents();
onAuthed();
</script>
